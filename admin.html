<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publish App - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #1C1C1E; /* Основной темный фон[span_8](start_span)[span_8](end_span) */
        }
        .admin-input {
            width: 100%; 
            background-color: #151517; /* Чуть темнее основного фона[span_9](start_span)[span_9](end_span) */
            border: 1px solid #333; 
            color: #FFFFFF; 
            border-radius: 12px; 
            padding: 12px 16px; 
            font-size: 14px; 
            outline: none; 
            transition: border-color 0.2s;
        }
        .admin-input:focus { border-color: #34C759; }
        .admin-label { display: block; color: #A0A0A5; font-size: 14px; margin-bottom: 6px; font-weight: 500; }
    </style>
</head>
<body class="text-white pb-10 relative">

    <!-- Верхний бар -->
    <header class="flex justify-between items-center px-4 pt-6 pb-4 border-b border-gray-800">
        <h1 class="text-[28px] font-bold text-white">Publish App</h1>
        <button id="logoutBtn" class="text-[#A0A0A5] hover:text-white transition-all text-sm">Logout <i class="fas fa-sign-out-alt ml-1"></i></button>
    </header>

    <main class="px-4 py-6">
        <form id="publishForm" class="flex flex-col gap-5">
            <div>
                <label class="admin-label">Title</label>
                <input type="text" id="title" class="admin-input" placeholder="e.g. Gift Cards" required>
            </div>

            <div>
                <label class="admin-label">Category</label>
                <div class="flex gap-2">
                    <select id="category" class="admin-input flex-1" required>
                        <option value="" disabled selected>Select category...</option>
                    </select>
                    <!-- Кнопка вызова модального окна -->
                    <button type="button" id="openCategoryModalBtn" class="bg-[#333] text-white px-4 rounded-xl border border-gray-700 hover:bg-gray-700 transition-all">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="admin-label">Short Description</label>
                <input type="text" id="description" class="admin-input" placeholder="Curated vouchers..." required>
            </div>

            <div>
                <label class="admin-label">Full Description (for Modal)</label>
                <textarea id="full_description" class="admin-input min-h-[100px]" required></textarea>
            </div>

            <div>
                <label class="admin-label">App URL</label>
                <input type="url" id="url" class="admin-input" placeholder="https://example.com" required>
            </div>

            <div>
                <label class="admin-label">SVG Icon Code</label>
                <textarea id="svg_icon" class="admin-input min-h-[100px] font-mono text-xs" placeholder='<svg viewBox="0 0 24 24">...</svg>' required></textarea>
            </div>

            <label class="flex items-center gap-3 cursor-pointer mt-2">
                <input type="checkbox" id="is_new" class="w-5 h-5 rounded border-gray-600 bg-[#151517] checked:bg-[#34C759] focus:ring-0 accent-[#34C759]">
                <span class="text-[16px] text-white font-medium">Add "New" badge</span>
            </label>

            <div id="statusMessage" class="hidden text-sm font-medium py-2 px-4 rounded-xl text-center"></div>

            <button type="submit" class="w-full bg-[#34C759] text-white font-bold text-[16px] py-4 rounded-[50px] mt-4 active:opacity-70 transition-all">
                Publish App
            </button>
        </form>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ КАТЕГОРИИ -->
    <div id="categoryModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center px-4 transition-all">
        <div class="bg-[#151517] w-full max-w-sm rounded-2xl border border-gray-800 p-6 shadow-xl">
            <h3 class="text-white text-lg font-bold mb-4">Add New Category</h3>
            
            <label class="block text-[#A0A0A5] text-sm mb-2 font-medium">Category Name</label>
            <input type="text" id="newCategoryName" class="w-full bg-[#1C1C1E] border border-[#333] text-white rounded-xl px-4 py-3 text-sm outline-none focus:border-[#34C759] transition-all mb-5" placeholder="e.g. Finance">
            
            <div id="modalError" class="hidden text-red-400 text-xs mb-4"></div>

            <div class="flex gap-3">
                <button type="button" id="closeModalBtn" class="flex-1 bg-transparent border border-gray-600 text-white py-3 rounded-xl font-medium active:opacity-70">Cancel</button>
                <button type="button" id="saveCategoryBtn" class="flex-1 bg-[#34C759] text-white py-3 rounded-xl font-medium active:opacity-70">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Подключение к Supabase[span_10](start_span)[span_10](end_span)
        const SUPABASE_URL = 'https://ucmmcvbrgwylkamosqek.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_KuFmGY0UnXGSJmkHMvSQAQ_zxMvAwc8';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. Проверка авторизации
        async function requireAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) window.location.href = 'login.html';
        }
        requireAuth();

        // 2. Логаут
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });

        // Вспомогательная функция для статусов
        function showStatus(text, isError = false) {
            const msg = document.getElementById('statusMessage');
            msg.textContent = text;
            msg.className = `text-sm font-medium py-2 px-4 rounded-xl text-center ${isError ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400'}`;
            setTimeout(() => msg.classList.add('hidden'), 5000);
        }

        // 3. Загрузка категорий в Select
        async function fetchCategories() {
            const { data, error } = await supabase.from('categories').select('*').order('created_at');
            const select = document.getElementById('category');
            select.innerHTML = '<option value="" disabled selected>Select category...</option>';
            if (data) {
                data.forEach(cat => {
                    select.insertAdjacentHTML('beforeend', `<option value="${cat.id}">${cat.name}</option>`);
                });
            }
        }
        fetchCategories();

        // 4. ЛОГИКА МОДАЛЬНОГО ОКНА ДЛЯ КАТЕГОРИЙ
        const categoryModal = document.getElementById('categoryModal');
        const newCategoryNameInput = document.getElementById('newCategoryName');
        const modalError = document.getElementById('modalError');

        // Открыть
        document.getElementById('openCategoryModalBtn').addEventListener('click', () => {
            categoryModal.classList.remove('hidden');
            newCategoryNameInput.value = '';
            modalError.classList.add('hidden');
            newCategoryNameInput.focus();
        });

        // Закрыть
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            categoryModal.classList.add('hidden');
        });

        // Сохранить категорию
        document.getElementById('saveCategoryBtn').addEventListener('click', async () => {
            const catName = newCategoryNameInput.value.trim();
            if (!catName) {
                modalError.textContent = 'Category name cannot be empty';
                modalError.classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('saveCategoryBtn');
            btn.disabled = true; 
            btn.textContent = 'Saving...';

            const { data, error } = await supabase.from('categories').insert([{ name: catName }]).select();
            
            btn.disabled = false; 
            btn.textContent = 'Save';

            if (error) {
                modalError.textContent = error.message;
                modalError.classList.remove('hidden');
            } else {
                categoryModal.classList.add('hidden');
                await fetchCategories();
                document.getElementById('category').value = data[0].id; // Автовыбор новой категории
            }
        });

        // 5. ПУБЛИКАЦИЯ ПРИЛОЖЕНИЯ
        document.getElementById('publishForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.textContent = 'Publishing...';

            const newApp = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                full_description: document.getElementById('full_description').value,
                url: document.getElementById('url').value,
                svg_icon: document.getElementById('svg_icon').value,
                category_id: document.getElementById('category').value,
                is_new: document.getElementById('is_new').checked,
                is_published: true
            };

            const { error } = await supabase.from('apps').insert([newApp]);
            
            if (error) {
                showStatus(error.message, true);
            } else {
                showStatus("App published successfully!");
                document.getElementById('publishForm').reset();
            }
            
            btn.disabled = false; 
            btn.textContent = 'Publish App';
        });
    </script>
</body>
</html>
