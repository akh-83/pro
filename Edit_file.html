<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание и Скачивание Файлов</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 700px;
        }

        h1 {
            color: #00bcd4; /* Cyan */
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #bbbbbb;
        }

        input[type="text"],
        textarea,
        select {
            width: calc(100% - 20px);
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #3a3a3a;
            color: #e0e0e0;
            font-size: 1em;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus,
        select:focus {
            border-color: #00bcd4; /* Cyan */
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 200px;
            font-family: 'Consolas', 'Monaco', monospace; /* Моноширинный шрифт для кода */
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: bold;
            color: #fff;
        }

        button#downloadButton {
            background-color: #4CAF50; /* Green */
        }

        button#downloadButton:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        button#resetButton {
            background-color: #f44336; /* Red */
        }

        button#resetButton:hover {
            background-color: #da3328;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Создать и Скачать Файл</h1>

        <div class="form-group">
            <label for="fileName">Название файла:</label>
            <input type="text" id="fileName" placeholder="Например: мой_скрипт" required>
        </div>

        <div class="form-group">
            <label for="fileContent">Содержимое файла (код или текст):</label>
            <textarea id="fileContent" placeholder="Введите ваш код или текст здесь..." required></textarea>
        </div>

        <div class="form-group">
            <label for="fileFormat">Выберите формат файла:</label>
            <select id="fileFormat">
                <option value="html">HTML (.html)</option>
                <option value="txt">Текстовый (.txt)</option>
                <option value="php">PHP (.php)</option>
                <option value="css">CSS (.css)</option>
                <option value="java">Java (.java)</option>
            </select>
        </div>

        <div class="button-group">
            <button id="downloadButton">Скачать Файл</button>
            <button id="resetButton">Очистить</button>
        </div>
    </div>

    <script>
        document.getElementById('downloadButton').addEventListener('click', function() {
            const fileName = document.getElementById('fileName').value.trim();
            const fileContent = document.getElementById('fileContent').value;
            const fileFormat = document.getElementById('fileFormat').value;

            if (!fileName) {
                alert('Пожалуйста, введите название файла.');
                return;
            }

            const fullFileName = `${fileName}.${fileFormat}`;
            const blob = new Blob([fileContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = fullFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url); // Освобождаем ресурс
        });

        document.getElementById('resetButton').addEventListener('click', function() {
            document.getElementById('fileName').value = '';
            document.getElementById('fileContent').value = '';
            document.getElementById('fileFormat').value = 'html'; // Сбросить на HTML
        });
    </script>
</body>
</html>
