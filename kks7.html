<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Калькулятор времени — Theme Stile</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* БАЗОВЫЕ СТИЛИ */
    body { background-color: #1b222d; color: #e6edf3; font-family: "Inter", sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 40px; margin: 0; padding-bottom: 40px; }
    
    /* СТИЛИ ВКЛАДОК ЯЗЫКОВ */
    .language-tabs { display: flex; gap: 4px; margin-bottom: -1px; z-index: 1; width: 94%; max-width: 400px; padding-left: 10px; box-sizing: border-box; }
    .lang-tab { 
      padding: 8px 16px; 
      background: #232a3b; 
      border: 1px solid #343e50; 
      border-bottom: none;
      border-radius: 8px 8px 0 0; 
      color: #8b949e; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 13px;
      transition: all 0.2s;
    }
    .lang-tab:hover { background: #2c354a; }
    .lang-tab.active { background: #4e73df; color: #fff; border-color: #4e73df; }

    /* КАЛЬКУЛЯТОР */
    .calculator { background-color: #232a3b; border-radius: 12px; padding: 30px; width: 94%; max-width: 400px; box-sizing: border-box; border: 1px solid #343e50; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); position: relative; z-index: 2; }
    .time-field { width: 100%; box-sizing: border-box; padding: 14px; margin: 8px 0 18px; border: 1px solid #343e50; border-radius: 8px; background: transparent; color: #fff; font-size: 19px; cursor: pointer; text-align: left; }
    .label { color: #8b949e; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ПОДГОТОВКА */
    .prep-card { border: 1px solid #343e50; border-radius: 8px; padding: 15px; margin-bottom: 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .radio-circle { width: 20px; height: 20px; border: 2px solid #8b949e; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .prep-card.active { border-color: #58a6ff; background: rgba(88, 166, 255, 0.05); }
    .prep-card.active .radio-circle { border-color: #58a6ff; }
    .radio-dot { width: 10px; height: 10px; background: #58a6ff; border-radius: 50%; display: none; }
    .prep-card.active .radio-dot { display: block; }

    /* КНОПКИ */
    .btn-group { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 600; color: #fff; cursor: pointer; font-size: 17px; }
    .btn-calc { background: #4e73df; }
    .btn-info { background: #343e50; border: 1px solid #454f63; }

    /* КНОПКА РАЗВЕРНУТЬ ИСТОРИЮ */
    .expand-btn { background: transparent; border: 1px solid #343e50; color: #8b949e; width: 100%; padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-top: 10px; font-size: 15px; font-weight: 600; transition: background 0.2s; }
    .expand-btn:hover { background: #2c354a; }
    .expand-icon { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }

    /* МОДАЛЬНЫЕ ОКНА */
    .picker-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; z-index: 9999; backdrop-filter: blur(5px); align-items: flex-start; padding-top: 20px; }
    .picker-container { background: #1b222d; width: 90%; max-width: 340px; border-radius: 20px; padding: 20px; border: 1px solid #343e50; }

    /* БАРАБАН */
    .picker-wheels { display: flex; justify-content: center; height: 200px; overflow: hidden; position: relative; gap: 5px; }
    .wheel { flex: 1; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; scroll-behavior: smooth; }
    .wheel div { height: 40px; line-height: 40px; font-size: 24px; color: #8b949e; scroll-snap-align: center; opacity: 0.2; }
    .wheel div.selected { color: #fff; opacity: 1; font-size: 29px; font-weight: bold; }
    .wheel div.spacer { height: 80px; }
    .picker-highlight { position: absolute; top: 80px; left: 0; width: 100%; height: 40px; background: rgba(255,255,255,0.07); border-radius: 8px; pointer-events: none; }

    /* ИСТОРИЯ (РЕЗУЛЬТАТЫ) */
    .history-card { background: #232a3b; border-radius: 12px; padding: 25px; margin-top: 25px; border: 1px solid #343e50; text-align: center; }
    .chart-container { position: relative; width: 180px; height: 180px; margin: 0 auto 20px; }
    .chart-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .chart-bg { fill: none; stroke: #343e50; stroke-width: 12; }
    .chart-fill { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
    .chart-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
    .chart-percent { font-size: 46px; font-weight: bold; display: block; }
    .chart-label { font-size: 14px; color: #8b949e; text-transform: uppercase; margin-top: 5px; display: block; }

    /* УВЕДОМЛЕНИЯ */
    .status-alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 16px; font-weight: 500; text-align: left; border-left: 4px solid transparent; color: #ffffff !important; }
    .alert-red { background: rgba(240, 103, 103, 0.25); border-left-color: #f06767; }
    .alert-orange { background: rgba(255, 152, 0, 0.25); border-left-color: #ff9800; }
    .alert-green { background: rgba(60, 212, 160, 0.25); border-left-color: #3cd4a0; }

    .legend { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; font-size: 14px; color: #8b949e; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    .stat-list { text-align: left; border-top: 1px solid #343e50; padding-top: 15px; }
    .stat-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 16px; }
    .item-label { display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ИНСТРУКЦИЯ */
    .instr-white { color: #ffffff !important; font-size: 17px !important; }
  </style>
</head>
<body>

  <div class="language-tabs">
    <div class="lang-tab" onclick="setLang('Eng')">Eng</div>
    <div class="lang-tab" onclick="setLang('Pol')">Pol</div>
    <div class="lang-tab" onclick="setLang('Esp')">Esp</div>
    <div class="lang-tab" onclick="setLang('Ukr')">Ukr</div>
    <div class="lang-tab active" onclick="setLang('Pyc')">Pyc</div>
  </div>

  <div class="calculator">
    <label class="label" id="l_qty">Количество штук</label>
    <input type="number" id="quantity" class="time-field" placeholder="0">

    <label class="label" id="l_tpi">Время на 1 штуку</label>
    <div id="timePerItem" class="time-field" onclick="openPicker('timePerItem')">00:00:30</div>

    <div class="prep-card" id="prepToggle" onclick="togglePrep()">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="radio-circle"><div class="radio-dot" id="radioDot" style="display:none;"></div></div>
        <span><b style="font-size: 19px;" id="l_prep">Подготовка</b><br><small style="color:#8b949e; font-size:14px;" id="l_prepSub">15 минут к норме</small></span>
      </div>
      <div id="statusLabel" class="status-text" style="font-size:14px; color:#8b949e; font-weight:bold;">НЕ АКТИВНО</div>
    </div>

    <label class="label" id="l_start">Начало</label>
    <div id="startTime" class="time-field" onclick="openPicker('startTime', true)">08:00</div>

    <label class="label" id="l_end">Окончание</label>
    <div id="endTime" class="time-field" onclick="openPicker('endTime')">00:00:00</div>

    <div class="btn-group">
      <button class="btn btn-calc" id="b_calc" onclick="calculate()">Рассчитать</button>
      <button class="btn btn-info" id="b_info" onclick="openInstruction()">Инструкция</button>
    </div>
    <div id="result"></div>
    <div id="savedListContainer" style="width: 100%;"></div>
  </div>

  <div id="pickerOverlay" class="picker-overlay">
    <div class="picker-container">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; color:#fff; font-size:17px;">
        <span onclick="closePicker()" id="p_cancel" style="color:#58a6ff; cursor:pointer;">Отмена</span>
        <b id="p_title">Время</b>
        <span onclick="confirmPicker()" id="p_done" style="color:#58a6ff; cursor:pointer;">Готово</span>
      </div>
      <div class="picker-wheels">
        <div class="picker-highlight"></div>
        <div class="wheel" id="hWheel"></div><div class="wheel" id="mWheel"></div><div class="wheel" id="sWheel"></div>
      </div>
    </div>
  </div>

  <div id="infoOverlay" class="picker-overlay">
    <div class="picker-container" style="width:90%; max-width:360px; max-height:85vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; margin-bottom:20px; position:sticky; top:0; background:#1b222d; padding-bottom:10px; z-index:10;">
        <b style="font-size:22px; color:#fff;" id="i_title">Инструкция</b>
        <span onclick="closeInstruction()" id="i_close" style="color:#58a6ff; cursor:pointer; font-weight:bold; font-size:17px;">Закрыть</span>
      </div>
      <div id="instructionContent"></div>
    </div>
  </div>

  <div id="historyModalOverlay" class="picker-overlay">
    <div class="picker-container" style="width:90%; max-width:360px; max-height:85vh; overflow-y:auto; padding: 20px 15px;">
      <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
        <span onclick="closeSavedModal()" style="color:#8b949e; cursor:pointer; font-size:32px; line-height:1;">&times;</span>
      </div>
      <div id="historyModalContent"></div>
    </div>
  </div>

  <script>
    // --- Инициализация Telegram Web App и Хранилища ---
    const tg = window.Telegram.WebApp;
    tg.ready();
    const userId = tg.initDataUnsafe?.user?.id || 'guest';
    const storageKey = 'time_calc_state_' + userId;
    
    let savedHistory = []; // Массив для истории расчетов
    let visibleHistoryCount = 3; // Количество отображаемых записей

    // Функция авто-очистки старых записей (старше 3 дней)
    function cleanOldHistory() {
      const threeDaysMs = 3 * 24 * 60 * 60 * 1000;
      const now = Date.now();
      const originalLength = savedHistory.length;
      
      savedHistory = savedHistory.filter(item => (now - item.id) <= threeDaysMs);
      
      // Если что-то было удалено, обновляем хранилище немедленно
      if (savedHistory.length !== originalLength) {
        saveState();
      }
    }

    function saveState() {
      const data = {
        lang: currentLang,
        qty: document.getElementById('quantity').value,
        tpi: document.getElementById('timePerItem').textContent,
        prep: isPrepActive,
        start: document.getElementById('startTime').textContent,
        end: document.getElementById('endTime').textContent,
        hasResult: document.getElementById('result').innerHTML !== "",
        history: savedHistory
      };
      localStorage.setItem(storageKey, JSON.stringify(data));
      if (tg.CloudStorage) tg.CloudStorage.setItem('calc_data', JSON.stringify(data));
    }

    function loadState() {
      const applyData = (val) => {
        try {
          const data = JSON.parse(val);
          if (data.history) savedHistory = data.history;
          
          cleanOldHistory(); // Чистим старые записи при загрузке

          if (data.lang) setLang(data.lang, false);
          if (data.qty) document.getElementById('quantity').value = data.qty;
          if (data.tpi) document.getElementById('timePerItem').textContent = data.tpi;
          if (data.prep !== undefined) { isPrepActive = data.prep; updatePrepStatus(); }
          if (data.start) document.getElementById('startTime').textContent = data.start;
          if (data.end) document.getElementById('endTime').textContent = data.end;
          
          renderHistoryList();
          if (data.hasResult) calculate(false);
        } catch(e) {}
      };

      if (tg.CloudStorage) {
        tg.CloudStorage.getItem('calc_data', (err, val) => {
          if (!err && val) applyData(val);
          else {
            const local = localStorage.getItem(storageKey);
            if (local) applyData(local);
          }
        });
      } else {
        const local = localStorage.getItem(storageKey);
        if (local) applyData(local);
      }
    }

    // Очистка полей ввода
    function clearState() {
      document.getElementById('quantity').value = '';
      document.getElementById('timePerItem').textContent = '00:00:30';
      isPrepActive = false;
      updatePrepStatus();
      document.getElementById('startTime').textContent = '08:00';
      document.getElementById('endTime').textContent = '00:00:00';
      document.getElementById('result').innerHTML = '';
      saveState(); 
    }
    // --------------------------------------------------

    let activeField = null, isPrepActive = false, shortFormat = false;
    let currentLang = 'Pyc';

    const tr = {
      'Pyc': {
        labels: { qty:'Количество штук', tpi:'Время на 1 штуку', prep:'Подготовка', prepSub:'15 минут к норме', start:'Начало', end:'Окончание', active:'АКТИВНО', inactive:'НЕ АКТИВНО', saved:'Сохраненные результаты' },
        btns: { calc:'Рассчитать', info:'Инструкция', cancel:'Отмена', done:'Готово', close:'Закрыть', pick:'Время', clear:'Очистить', save:'Сохранить', delete:'Удалить', showMore:'Показать ещё' },
        stats: { success:'Успеваемость', zone:'Вы сейчас находитесь в зоне:', plan:'План окончания:', norm:'Норма на всё:', spent1:'Затрачено на 1 шт:', spentNorm:'Время затрачено:', fact:'Факт. окончание:', qtyPerHour:'Кол. в час:', forThisTime:'За это время:' },
        legend: ['Риск', 'Не плохо', 'Норма'],
        zones: { risk: 'Красная зона риска', orange: 'Оранжевая зона', green: 'Зелёная зона', over: 'Красная зона' },
        msgs: { fail: 'ВЫ НЕ СПРАВЛЯЕТЕСЬ!', push: 'ПОДНАЖМИТЕ!', good: 'Хороший темп ТАК ДЕРЖАТЬ!', over: 'ВЫ ПРЕВЫШАЕТЕ НОРМУ!' },
        instr: [
          {t: 'Как пользоваться', c: '1. Впишите количество штук.<br>2. Время с чертежа.<br>3. Активируйте "Подготовку".<br>4. Укажите время начала/конца.'},
          {t: 'Как понимать цвета?', c: 'Цвет круга меняется: Красный — Вы не справляетесь с нормой, Оранжевый — Не плохо но лучше увеличить темп, Зеленый — Вы справляетесь с нормой. Если попали в красную зону, нужно исправить темп.'},
          {t: 'Процентное соотношение зон', c: 'Ниже 65%: Красная зона (Риск).<br>65-75%: Оранжевый (не плохо но лучше поднажать).<br>75-100%: Зеленый (Норма).<br>Выше 100%: Красный (Перебор).'}
        ]
      },
      'Eng': {
        labels: { qty:'Quantity', tpi:'Time per item', prep:'Preparation', prepSub:'15 min to norm', start:'Start', end:'End', active:'ACTIVE', inactive:'INACTIVE', saved:'Saved Results' },
        btns: { calc:'Calculate', info:'Instruction', cancel:'Cancel', done:'Done', close:'Close', pick:'Time', clear:'Clear', save:'Save', delete:'Delete', showMore:'Show more' },

        labels: { qty:'Ilość sztuk', tpi:'Czas na 1 sztukę', prep:'Przygotowanie', prepSub:'15 min do normy', start:'Początek', end:'Koniec', active:'AKTYWNE', inactive:'NIEAKTYWNE', saved:'Zapisane wyniki' },

        msgs: { fail: 'NIE DAJESZ RADY!', push: 'PRZYCIŚNIJ!', good: 'Dobre tempo TAK TRZYMAĆ!', over: 'PRZEKRACZASZ NORMĘ!' },
        instr: [
          {t: 'Jak używać', c: '1. Wpisz ilość.<br>2. Czas z rysunku.<br>3. Aktywuj "Przygotowanie".<br>4. Ustaw czas startu/końca.'},
          {t: 'Znaczenie kolorów', c: 'Kolor koła zmienia się: Czerwony — Nie wyrabiasz się, Pomarańczowy — Nieźle ale przyspiesz, Zielony — Wyrabiasz się.'},
          {t: 'Procenty stref', c: 'Poniżej 65%: Czerwony (Ryzyko).<br>65-75%: Pomarańczowy.<br>75-100%: Zielony (Norma).<br>Powyżej 100%: Czerwony (Nadmiar).'}
        ]
      },
      'Esp': {
        labels: { qty:'Cantidad', tpi:'Tiempo por pieza', prep:'Preparación', prepSub:'15 min a la norma', start:'Inicio', end:'Fin', active:'ACTIVO', inactive:'INACTIVO', saved:'Resultados guardados' },
        btns: { calc:'Calcular', info:'Instrucción', cancel:'Cancelar', done:'Hecho', close:'Cerrar', pick:'Tiempo', clear:'Limpiar', save:'Guardar', delete:'Eliminar', showMore:'Mostrar más' },
        stats: { success:'Eficiencia', zone:'Estás en la zona:', plan:'Fin previsto:', norm:'Norma total:', spent1:'Gasto por 1 pza:', spentNorm:'Tiempo gastado:', fact:'Fin real:', qtyPerHour:'Cant. por hora:', forThisTime:'En este tiempo:' },
        legend: ['Riesgo', 'Regular', 'Normal'],
        zones: { risk: 'Zona Roja de Riesgo', orange: 'Zona Naranja', green: 'Zona Verde', over: 'Zona Roja' },

      },
      'Ukr': {

        legend: ['Ризик', 'Не погано', 'Норма'],
        zones: { risk: 'Червона зона ризику', orange: 'Помаранчева зона', green: 'Зелена зона', over: 'Червона зона' },
        msgs: { fail: 'ВИ НЕ СПРАВЛЯЄТЕСЬ!', push: 'ПІДНАТИСНІТЬ!', good: 'Хороший темп ТАК ТРИМАТИ!', over: 'ВИ ПЕРЕВИЩУЄТЕ НОРМУ!' },
        instr: [
          {t: 'Як користуватися', c: '1. Впишіть кількість штук.<br>2. Час з креслення.<br>3. Активуйте "Підготовку".<br>4. Вкажіть час.'},

    function setLang(lang, save = true) {
      currentLang = lang;
      const t = tr[lang] || tr['Pyc'];
      document.querySelectorAll('.lang-tab').forEach(el => el.classList.toggle('active', el.textContent === lang));
      document.getElementById('l_qty').textContent = t.labels.qty;
      document.getElementById('l_tpi').textContent = t.labels.tpi;
      document.getElementById('l_prep').textContent = t.labels.prep;
      document.getElementById('l_prepSub').textContent = t.labels.prepSub;
      document.getElementById('l_start').textContent = t.labels.start;
      document.getElementById('l_end').textContent = t.labels.end;
      document.getElementById('b_calc').textContent = t.btns.calc;
      document.getElementById('b_info').textContent = t.btns.info;
      document.getElementById('p_cancel').textContent = t.btns.cancel;
      document.getElementById('p_done').textContent = t.btns.done;
      document.getElementById('p_title').textContent = t.btns.pick;
      document.getElementById('i_title').textContent = t.btns.info;
      document.getElementById('i_close').textContent = t.btns.close;
      updatePrepStatus();
      let html = '';
      t.instr.forEach(item => {
        html += `<div style="background:#232a3b; border-radius:8px; margin-bottom:8px; border:1px solid #343e50;"><div style="padding:16px; display:flex; justify-content:space-between; cursor:pointer; color:#58a6ff; font-size:17px;" onclick="toggleAccordion(this)">${item.t} <span>▼</span></div><div class="instr-white" style="padding:0 16px 16px; display:none;">${item.c}</div></div>`;
      });
      document.getElementById('instructionContent').innerHTML = html;
      
      renderHistoryList(); 
      if(document.getElementById('result').innerHTML !== "") calculate(false);
      if(save) saveState();
    }

    function initWheel(id, max) {
      const w = document.getElementById(id); w.innerHTML = '<div class="spacer"></div>';
      for (let i=0; i<=max; i++) { let d = document.createElement('div'); d.textContent = String(i).padStart(2,'0'); w.appendChild(d); }
      w.innerHTML += '<div class="spacer"></div>';
      w.onscroll = () => { let idx = Math.round(w.scrollTop/40); w.querySelectorAll('div:not(.spacer)').forEach((item, i) => item.classList.toggle('selected', i === idx)); };
    }
    initWheel('hWheel', 23); initWheel('mWheel', 59); initWheel('sWheel', 59);

    function openPicker(id, isShort=false) { activeField = id; shortFormat = isShort; document.getElementById('sWheel').style.display = isShort ? 'none' : 'block'; document.getElementById('pickerOverlay').style.display = 'flex'; }
    function closePicker() { document.getElementById('pickerOverlay').style.display = 'none'; }
    function confirmPicker() {
      const h = document.querySelector('#hWheel .selected')?.textContent || "00", m = document.querySelector('#mWheel .selected')?.textContent || "00", s = document.querySelector('#sWheel .selected')?.textContent || "00";
      document.getElementById(activeField).textContent = shortFormat ? `${h}:${m}` : `${h}:${m}:${s}`; closePicker();
      saveState();
    }

    function openInstruction() { document.getElementById('infoOverlay').style.display = 'flex'; }
    function closeInstruction() { document.getElementById('infoOverlay').style.display = 'none'; }
    function toggleAccordion(el) { let c = el.nextElementSibling; c.style.display = (c.style.display === 'none' ? 'block' : 'none'); }

    function togglePrep() { isPrepActive = !isPrepActive; updatePrepStatus(); saveState(); }

    function updatePrepStatus() {
      const t = tr[currentLang] || tr['Pyc'];
      document.getElementById('radioDot').style.display = isPrepActive ? 'block' : 'none';
      document.getElementById('prepToggle').classList.toggle('active', isPrepActive);
      document.getElementById('statusLabel').textContent = isPrepActive ? t.labels.active : t.labels.inactive;
      document.getElementById('statusLabel').style.color = isPrepActive ? '#3cd4a0' : '#8b949e';
    }

    function parseToSec(str) { let p = str.split(':').map(Number); return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*3600 + p[1]*60; }
    function formatTime(s) { let h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.round(s%60); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }

    // Сохранение в историю
    function saveRecord() {
      const q = parseFloat(document.getElementById('quantity').value) || 0;
      if (!q) return;
      const tpi = document.getElementById('timePerItem').textContent;
      const prep = isPrepActive;
      const start = document.getElementById('startTime').textContent;
      const end = document.getElementById('endTime').textContent;
      
      const tpiSec = parseToSec(tpi), prepSec = prep ? 900 : 0, norm = (q * tpiSec) + prepSec;
      const startSec = parseToSec(start), endSec = parseToSec(end);
      
      let eff = 0, clr = "#8b949e";
      if (end !== "00:00:00") {
        let FactT = endSec >= startSec ? endSec - startSec : (86400 - startSec) + endSec;
        eff = Math.round((norm / FactT) * 100);
      }
      
      if (eff > 0) {
        if (eff < 65) clr="#f06767";
        else if (eff < 75) clr="#ff9800";
        else if (eff <= 100) clr="#3cd4a0";
        else clr="#f06767";
      }

      const record = { id: Date.now(), qty: q, tpi, prep, start, end, eff, clr };
      
      savedHistory.unshift(record);
      // Ограничиваем историю 10 последними блоками (как вы просили ранее)
      if(savedHistory.length > 10) savedHistory.pop();
      
      visibleHistoryCount = 3; // При новом сохранении скрываем развернутый список до 3
      saveState();
      renderHistoryList();
    }

    function showMoreHistory() {
      visibleHistoryCount += 3;
      renderHistoryList();
    }

    function renderHistoryList() {
      cleanOldHistory(); // Чистим каждый раз перед отрисовкой
      const container = document.getElementById('savedListContainer');
      
      if(savedHistory.length === 0) {
        container.innerHTML = '';
        return;
      }
      
      const t = tr[currentLang] || tr['Pyc'];
      let html = `<div style="margin-top: 35px; margin-bottom: 15px; font-size: 16px; text-transform:uppercase; letter-spacing:0.5px; color: #8b949e;">${t.labels.saved}</div>`;
      
      // Берём только необходимое количество элементов (visibleHistoryCount)
      const itemsToRender = savedHistory.slice(0, visibleHistoryCount);
      
      itemsToRender.forEach(item => {
        html += `
          <div class="prep-card" style="display:flex; flex-direction:column; align-items:stretch; gap:6px; margin-bottom:10px; padding: 12px 15px;" onclick="openSavedModal(${item.id})">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <b style="color:${item.clr}; font-size:18px;">${item.eff}%</b>
              <span style="color:#8b949e; font-size:14px;">${t.labels.qty}: <b style="color:#fff">${item.qty}</b></span>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; font-size:14px; color:#8b949e;">
              <span>${item.start} - ${item.end}</span>
              <span>${t.labels.tpi}: <b style="color:#fff">${item.tpi}</b></span>
            </div>
          </div>`;
      });

      // Если в массиве остались еще записи, показываем кнопку-стрелочку
      if (savedHistory.length > visibleHistoryCount) {
        html += `
          <button class="expand-btn" onclick="showMoreHistory()">
            ${t.btns.showMore}
            <svg class="expand-icon" viewBox="0 0 24 24">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>`;
      }
      
      container.innerHTML = html;
    }

    function openSavedModal(id) {
      const item = savedHistory.find(x => x.id === id);
      if(!item) return;
      
      const t = tr[currentLang] || tr['Pyc'];
      const tpiSec = parseToSec(item.tpi), prepSec = item.prep ? 900 : 0, norm = (item.qty * tpiSec) + prepSec;
      const startSec = parseToSec(item.start), plan = formatTime((startSec + norm) % 86400), endStr = item.end;
      
      let eff = 0, spent = "--:--:--", spentPer = "--:--:--", neededQty = 0;
      if (endStr !== "00:00:00") {
        let FactS = parseToSec(endStr), FactT = FactS >= startSec ? FactS - startSec : (86400 - startSec) + FactS;
        eff = Math.round((norm / FactT) * 100);
        spent = formatTime(FactT);
        spentPer = formatTime((FactT - prepSec) / item.qty);
        neededQty = tpiSec > 0 ? Math.floor(Math.max(0, FactT - prepSec) / tpiSec) : 0;
      }
      
      let qph = tpiSec > 0 ? 3600 / tpiSec : 0, maxQph = Math.floor(qph);
      let clr = "#8b949e", zn = "---", msg = "", alrt = "";
      if (eff > 0) {
        if (eff < 65) { clr="#f06767"; zn=t.zones.risk; msg=t.msgs.fail; alrt="alert-red"; }
        else if (eff < 75) { clr="#ff9800"; zn=t.zones.orange; msg=t.msgs.push; alrt="alert-orange"; }
        else if (eff <= 100) { clr="#3cd4a0"; zn=t.zones.green; msg=t.msgs.good; alrt="alert-green"; }
        else { clr="#f06767"; zn=t.zones.over; msg=t.msgs.over; alrt="alert-red"; }
      }
      const off = 440 - (440 * Math.min(eff, 100)) / 100;
      
      const html = `<div class="history-card" style="margin-top:0;"><div class="chart-container"><svg class="chart-svg" viewBox="0 0 160 160"><circle class="chart-bg" cx="80" cy="80" r="70" /><circle class="chart-fill" cx="80" cy="80" r="70" style="stroke:${clr}; stroke-dasharray:440; stroke-dashoffset:${off};" /></svg><div class="chart-text"><span class="chart-percent" style="color:${clr}">${eff}%</span><span class="chart-label">${t.stats.success}</span></div></div><div class="status-alert ${alrt}">${t.stats.zone} <b>${zn}</b><br>${msg}</div><div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#f06767"></div>${t.legend[0]}</div><div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div>${t.legend[1]}</div><div class="legend-item"><div class="legend-dot" style="background:#3cd4a0"></div>${t.legend[2]}</div></div><div class="stat-list"><div class="stat-item"><div class="item-label"><div class="dot" style="background:#3cd4a0"></div>${t.stats.plan}</div><b>${plan}</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#f06767"></div>${t.stats.norm}</div><b>${formatTime(norm)}</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#9c27b0"></div>${t.stats.qtyPerHour}</div><b>${maxQph} шт.</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#ffeb3b"></div>${t.stats.forThisTime}</div><b>${neededQty} шт.</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#00bcd4"></div>${t.stats.spent1}</div><b>${spentPer}</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#4e73df"></div>${t.stats.spentNorm}</div><b>${spent}</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#ff9800"></div>${t.stats.fact}</div><b>${endStr}</b></div></div><button class="btn" style="background: rgba(240, 103, 103, 0.1); border: 1px solid #f06767; color: #f06767; margin-top: 20px; width: 100%;" onclick="deleteSavedRecord(${item.id})">${t.btns.delete}</button></div>`;
      
      document.getElementById('historyModalContent').innerHTML = html;
      document.getElementById('historyModalOverlay').style.display = 'flex';
    }

    function closeSavedModal() {
      document.getElementById('historyModalOverlay').style.display = 'none';
    }

    function deleteSavedRecord(id) {
      savedHistory = savedHistory.filter(x => x.id !== id);
      saveState();
      renderHistoryList();
      closeSavedModal();
    }

    function calculate(save = true) {
      const q = parseFloat(document.getElementById('quantity').value) || 0; if (!q) return;
      const t = tr[currentLang] || tr['Pyc'];
      const tpi = parseToSec(document.getElementById('timePerItem').textContent), prep = isPrepActive ? 900 : 0, norm = (q * tpi) + prep;
      const start = parseToSec(document.getElementById('startTime').textContent), plan = formatTime((start + norm) % 86400), endStr = document.getElementById('endTime').textContent;
      let eff = 0, spent = "--:--:--", spentPer = "--:--:--", neededQty = 0;
      if (endStr !== "00:00:00") { 
        let FactS = parseToSec(endStr), FactT = FactS >= start ? FactS - start : (86400 - start) + FactS; 
        eff = Math.round((norm / FactT) * 100); 
        spent = formatTime(FactT); 
        spentPer = formatTime((FactT - prep) / q); 
        neededQty = tpi > 0 ? Math.floor(Math.max(0, FactT - prep) / tpi) : 0;
      }
      let qph = tpi > 0 ? 3600 / tpi : 0, maxQph = Math.floor(qph);
      let clr = "#8b949e", zn = "---", msg = "", alrt = "";
      if (eff > 0) {
        if (eff < 65) { clr="#f06767"; zn=t.zones.risk; msg=t.msgs.fail; alrt="alert-red"; }
        else if (eff < 75) { clr="#ff9800"; zn=t.zones.orange; msg=t.msgs.push; alrt="alert-orange"; }
        else if (eff <= 100) { clr="#3cd4a0"; zn=t.zones.green; msg=t.msgs.good; alrt="alert-green"; }
        else { clr="#f06767"; zn=t.zones.over; msg=t.msgs.over; alrt="alert-red"; }
      }
      const off = 440 - (440 * Math.min(eff, 100)) / 100;
      
      document.getElementById('result').innerHTML = `<div class="history-card"><div class="chart-container"><svg class="chart-svg" viewBox="0 0 160 160"><circle class="chart-bg" cx="80" cy="80" r="70" /><circle class="chart-fill" cx="80" cy="80" r="70" style="stroke:${clr}; stroke-dasharray:440; stroke-dashoffset:${off};" /></svg><div class="chart-text"><span class="chart-percent" style="color:${clr}">${eff}%</span><span class="chart-label">${t.stats.success}</span></div></div><div class="status-alert ${alrt}">${t.stats.zone} <b>${zn}</b><br>${msg}</div><div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#f06767"></div>${t.legend[0]}</div><div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div>${t.legend[1]}</div><div class="legend-item"><div class="legend-dot" style="background:#3cd4a0"></div>${t.legend[2]}</div></div><div class="stat-list"><div class="stat-item"><div class="item-label"><div class="dot" style="background:#3cd4a0"></div>${t.stats.plan}</div><b>${plan}</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#f06767"></div>${t.stats.norm}</div><b>${formatTime(norm)}</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#9c27b0"></div>${t.stats.qtyPerHour}</div><b>${maxQph} шт.</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#ffeb3b"></div>${t.stats.forThisTime}</div><b>${neededQty} шт.</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#00bcd4"></div>${t.stats.spent1}</div><b>${spentPer}</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#4e73df"></div>${t.stats.spentNorm}</div><b>${spent}</b></div><div class="stat-item"><div class="item-label"><div class="dot" style="background:#ff9800"></div>${t.stats.fact}</div><b>${endStr}</b></div></div><div style="display: flex; gap: 10px; margin-top: 25px;"><button class="btn" style="background: rgba(88, 166, 255, 0.1); border: 1px solid #58a6ff; color: #58a6ff;" onclick="saveRecord()">${t.btns.save}</button><button class="btn" style="background: rgba(240, 103, 103, 0.1); border: 1px solid #f06767; color: #f06767;" onclick="clearState()">${t.btns.clear}</button></div></div>`;
      
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      if (save) saveState();
    }

    // Сохранять при вводе количества
    document.getElementById('quantity').addEventListener('input', saveState);

    // Первичная инициализация и загрузка состояния
    setLang('Pyc', false);
    loadState();
  </script>
</body>
</html>
