<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Калькулятор времени — Theme Stile</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="text/javascript" src="https://unpkg.com/@zxing/library@latest/umd/index.min.js" defer></script>
  
  <style>
    /* БАЗОВЫЕ СТИЛИ */
    body { background-color: #1b222d; color: #e6edf3; font-family: "Inter", sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 40px; margin: 0; padding-bottom: 40px; }
    
    /* КАЛЬКУЛЯТОР */
    .calculator { background-color: #232a3b; border-radius: 12px; padding: 30px; width: 94%; max-width: 400px; box-sizing: border-box; border: 1px solid #343e50; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); position: relative; z-index: 2; }
    .time-field { width: 100%; box-sizing: border-box; padding: 14px; margin: 8px 0 18px; border: 1px solid #343e50; border-radius: 8px; background: transparent; color: #fff; font-size: 19px; cursor: pointer; text-align: left; outline: none; transition: border 0.2s; }
    .time-field:focus { border-color: #4e73df; }
    .label { color: #8b949e; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ПОДГОТОВКА */
    .prep-card { border: 1px solid #343e50; border-radius: 8px; padding: 15px; margin-bottom: 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .radio-circle { width: 20px; height: 20px; border: 2px solid #8b949e; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .prep-card.active { border-color: #58a6ff; background: rgba(88, 166, 255, 0.05); }
    .prep-card.active .radio-circle { border-color: #58a6ff; }
    .radio-dot { width: 10px; height: 10px; background: #58a6ff; border-radius: 50%; display: none; }
    .prep-card.active .radio-dot { display: block; }

    /* КНОПКИ */
    .btn-group { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 600; color: #fff; cursor: pointer; font-size: 17px; }
    .btn-calc { background: #4e73df; }
    .btn-info { background: #343e50; border: 1px solid #454f63; }

    /* МОДАЛЬНЫЕ ОКНА */
    .picker-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; z-index: 9999; backdrop-filter: blur(5px); align-items: flex-start; padding-top: 20px; }
    .picker-container { background: #1b222d; width: 90%; max-width: 340px; border-radius: 20px; padding: 20px; border: 1px solid #343e50; }

    /* БАРАБАН */
    .picker-wheels { display: flex; justify-content: center; height: 200px; overflow: hidden; position: relative; gap: 5px; }
    .wheel { flex: 1; height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; scroll-behavior: smooth; }
    .wheel::-webkit-scrollbar { display: none; }
    .wheel div { height: 40px; line-height: 40px; font-size: 24px; color: #8b949e; scroll-snap-align: center; opacity: 0.2; text-align: center; }
    .wheel div.selected { color: #fff; opacity: 1; font-size: 29px; font-weight: bold; }
    .wheel div.spacer { height: 80px; }
    .picker-highlight { position: absolute; top: 80px; left: 0; width: 100%; height: 40px; background: rgba(255,255,255,0.07); border-radius: 8px; pointer-events: none; }

    /* ИСТОРИЯ (РЕЗУЛЬТАТЫ) */
    .history-card { background: #232a3b; border-radius: 12px; padding: 25px; margin-top: 25px; border: 1px solid #343e50; text-align: center; }
    .chart-container { position: relative; width: 180px; height: 180px; margin: 0 auto 20px; }
    .chart-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .chart-bg { fill: none; stroke: #343e50; stroke-width: 12; }
    .chart-fill { fill: none; stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
    .chart-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
    .chart-percent { font-size: 46px; font-weight: bold; display: block; }
    .chart-label { font-size: 14px; color: #8b949e; text-transform: uppercase; margin-top: 5px; display: block; }

    /* УВЕДОМЛЕНИЯ */
    .status-alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 16px; font-weight: 500; text-align: left; border-left: 4px solid transparent; color: #ffffff !important; }
    .alert-red { background: rgba(240, 103, 103, 0.25); border-left-color: #f06767; }
    .alert-orange { background: rgba(255, 152, 0, 0.25); border-left-color: #ff9800; }
    .alert-green { background: rgba(60, 212, 160, 0.25); border-left-color: #3cd4a0; }

    .legend { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; font-size: 14px; color: #8b949e; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    .stat-list { text-align: left; border-top: 1px solid #343e50; padding-top: 15px; }
    .stat-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 16px; }
    .item-label { display: flex; align-items: center; gap: 10px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* ИНСТРУКЦИЯ */
    .instr-white { color: #ffffff !important; font-size: 17px !important; }

    /* КНОПКА ПОКАЗАТЬ ЕЩЕ */
    .expand-btn { background: transparent; border: 1px solid #343e50; color: #8b949e; width: 100%; padding: 12px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-top: 10px; font-size: 15px; font-weight: 600; transition: background 0.2s; }
    .expand-btn:hover { background: #2c354a; }
    .expand-icon { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }

    /* АВТОРСКОЕ ПРАВО */
    .copyright { text-align: center; color: #8b949e; font-size: 13px; margin-top: 25px; letter-spacing: 0.5px; width: 100%; }
    .copyright span { color: #4e73df; font-weight: bold; }

    /* СКАНЕР ШТРИХКОДОВ (FULLSCREEN) */
    .scanner-modal { position: fixed; inset: 0; background: transparent; z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; }
    .scanner-slit { width: 100%; height: 80px; position: relative; overflow: hidden; border-top: 2px solid #4e73df; border-bottom: 2px solid #4e73df; background-color: #000; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); z-index: 20; }
    .scanner-slit video { width: 100%; height: 100%; object-fit: cover; }
    .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background-color: #f06767; box-shadow: 0 0 8px 2px rgba(240, 103, 103, 0.6); animation: scan 2s infinite linear; z-index: 30; }
    @keyframes scan { 0% { top: 0; } 50% { top: 78px; } 100% { top: 0; } }
    .overlay-top, .overlay-bottom { position: absolute; left: 0; right: 0; background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(2px); z-index: 10; }
    .overlay-top { top: 0; }
    .overlay-bottom { bottom: 0; }
    
    .torch-btn { position: absolute; top: 24px; right: 24px; background: rgba(35, 42, 59, 0.9); padding: 12px; border-radius: 50%; color: #fff; z-index: 50; border: 1px solid #454f63; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; outline: none; }
    .torch-btn.active { color: #ffeb3b; border-color: #ffeb3b; }
    .stop-scan-btn { position: absolute; bottom: 40px; background: #f06767; color: white; padding: 14px 40px; border-radius: 12px; font-weight: 600; z-index: 50; border: none; font-size: 17px; cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: background 0.2s; }
    .stop-scan-btn:active { background: #d32f2f; }
  </style>
</head>
<body>

  <div class="calculator">
    
    <label class="label" id="l_barcode">Штрихкод</label>
    <div style="position: relative; width: 100%; margin: 8px 0 18px;">
      <input type="text" id="barcodeInput" class="time-field" style="margin: 0; padding-right: 55px;" placeholder="---">
      <div onclick="startScanning()" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: rgba(78, 115, 223, 0.15); transition: background 0.2s;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4e73df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M7 8v8M10 8v8M14 8v8M17 8v8" />
        </svg>
      </div>
    </div>

    <label class="label" id="l_qty">Количество штук</label>
    <input type="number" id="quantity" class="time-field" value="1" placeholder="0">

    <label class="label" id="l_tpi">Время на 1 штуку</label>
    <div style="position: relative; width: 100%; margin: 8px 0 18px;">
      <input type="text" id="timePerItem" class="time-field" style="margin: 0; padding-right: 55px; cursor: text;" value="00:00:01" inputmode="numeric" oninput="formatTimeInput(event)" onblur="padTimeInput(event)">
      <div onclick="openPicker('timePerItem')" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: rgba(78, 115, 223, 0.15); transition: background 0.2s;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4e73df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
    </div>

    <div class="prep-card" id="prepToggle" onclick="togglePrep()">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="radio-circle"><div class="radio-dot" id="radioDot" style="display:none;"></div></div>
        <span><b style="font-size: 19px;" id="l_prep">Подготовка</b><br><small style="color:#8b949e; font-size:14px;" id="l_prepSub">15 минут к норме</small></span>
      </div>
      <div id="statusLabel" class="status-text" style="font-size:14px; color:#8b949e; font-weight:bold;">НЕ АКТИВНО</div>
    </div>

    <label class="label" id="l_start">Начало</label>
    <div style="position: relative; width: 100%; margin: 8px 0 18px;">
      <input type="text" id="startTime" class="time-field" style="margin: 0; padding-right: 55px; cursor: text;" value="00:00:00" inputmode="numeric" oninput="formatTimeInput(event)" onblur="padTimeInput(event)">
      <div onclick="openPicker('startTime')" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: rgba(78, 115, 223, 0.15); transition: background 0.2s;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4e73df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
    </div>

    <label class="label" id="l_end">Окончание</label>
    <div style="position: relative; width: 100%; margin: 8px 0 18px;">
      <input type="text" id="endTime" class="time-field" style="margin: 0; padding-right: 55px; cursor: text;" value="00:00:00" inputmode="numeric" oninput="formatTimeInput(event)" onblur="padTimeInput(event)">
      <div onclick="openPicker('endTime')" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: rgba(78, 115, 223, 0.15); transition: background 0.2s;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4e73df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-calc" id="b_calc" onclick="calculate()">Рассчитать</button>
      <button class="btn btn-info" id="b_info" onclick="openInstruction()">Инструкция</button>
    </div>
    <div id="result"></div>
    <div id="savedListContainer" style="width: 100%;"></div>
  </div>

  <div class="copyright">
    © <span id="currentYear"></span> <span>AKH</span>. All rights reserved.
  </div>

  <div id="pickerOverlay" class="picker-overlay">
    <div class="picker-container">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; color:#fff; font-size:17px;">
        <span onclick="closePicker()" id="p_cancel" style="color:#58a6ff; cursor:pointer;">Отмена</span>
        <b id="p_title">Время</b>
        <span onclick="confirmPicker()" id="p_done" style="color:#58a6ff; cursor:pointer;">Готово</span>
      </div>
      <div class="picker-wheels">
        <div class="picker-highlight"></div>
        <div class="wheel" id="hWheel"></div><div class="wheel" id="mWheel"></div><div class="wheel" id="sWheel"></div>
      </div>
    </div>
  </div>

  <div id="infoOverlay" class="picker-overlay">
    <div class="picker-container" style="width:90%; max-width:360px; max-height:85vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; margin-bottom:20px; position:sticky; top:0; background:#1b222d; padding-bottom:10px; z-index:10;">
        <b style="font-size:22px; color:#fff;" id="i_title">Инструкция</b>
        <span onclick="closeInstruction()" id="i_close" style="color:#58a6ff; cursor:pointer; font-weight:bold; font-size:17px;">Закрыть</span>
      </div>
      <div id="instructionContent"></div>
    </div>
  </div>

  <div id="historyModalOverlay" class="picker-overlay">
    <div class="picker-container" style="width:90%; max-width:360px; max-height:85vh; overflow-y:auto; padding: 20px 15px;">
      <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
        <span onclick="closeSavedModal()" style="color:#8b949e; cursor:pointer; font-size:32px; line-height:1;">&times;</span>
      </div>
      <div id="historyModalContent"></div>
    </div>
  </div>

  <div id="scanner-modal" class="scanner-modal">
    <div class="overlay-top" id="overlay-top"></div>
    
    <button id="torch-btn" class="torch-btn" onclick="toggleTorch(event)" style="display: none;">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M11 2h2v5h-2V2zm4.19 3.4l1.42-1.42 1.41 1.41-1.41 1.42-1.42-1.41zM5.39 6.81L3.98 5.4 5.39 3.98l1.42 1.42-1.42 1.41zM12 9c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zM2 13h5v2H2v-2zm15 0h5v2h-5v-2zM6.81 18.61l-1.42 1.42-1.41-1.41 1.41-1.42 1.42 1.41zm11.8 0l1.42 1.42 1.41-1.41-1.41-1.42-1.42 1.41z"/></svg>
    </button>

    <div id="scanner-slit" class="scanner-slit">
        <video id="video" playsinline></video>
        <div class="scan-line"></div>
    </div>

    <div class="overlay-bottom" id="overlay-bottom"></div>

    <button id="stop-btn" class="stop-scan-btn" onclick="stopScanning()">Отмена</button>
  </div>

  <script>
    // --- 1. ИНИЦИАЛИЗАЦИЯ TELEGRAM WEB APP ---
    var tg = typeof window !== 'undefined' && window.Telegram ? window.Telegram.WebApp : null;
    
    if (tg) {
        tg.ready(); // Говорим Telegram, что приложение загружено (убирает белый экран)
        try { 
            tg.expand(); // Разворачиваем на весь экран
            tg.setHeaderColor('#1b222d'); // Красим верхнюю панель в цвет фона
            tg.setBackgroundColor('#1b222d'); // Красим фон для плавности
        } catch(e) {}
    }
    
    var userId = 'guest';
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        userId = tg.initDataUnsafe.user.id;
    }
    var storageKey = 'time_calc_state_' + userId;
    
    // Установка текущего года
    var yearEl = document.getElementById('currentYear');
    if (yearEl) {
        yearEl.textContent = new Date().getFullYear();
    }

    // SVG константы
    const SVG_SCANNER_SMALL = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4e73df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M7 8v8M10 8v8M14 8v8M17 8v8" /></svg>`;
    const SVG_SCANNER_LARGE = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4e73df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M7 8v8M10 8v8M14 8v8M17 8v8" /></svg>`;

    let savedHistory = []; 
    let visibleHistoryCount = 3; 

    // --- 2. ЛОГИКА СКАНЕРА ШТРИХКОДОВ ---
    let codeReader = null;
    let isScanning = false;
    let torchEnabled = false;

    async function startScanning() {
      if (!codeReader && typeof ZXing !== 'undefined') {
          codeReader = new ZXing.BrowserMultiFormatReader();
      }
      if (!codeReader) return;

      isScanning = true;
      document.getElementById('scanner-modal').style.display = 'flex';
      adjustOverlays();

      const constraints = {
          video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
      };

      try {
          await codeReader.decodeFromConstraints(constraints, 'video', (result, err) => {
              if (result && isScanning) {
                  const points = result.getResultPoints();
                  const videoEl = document.getElementById('video');
                  const scannerSlit = document.getElementById('scanner-slit');
                  
                  if (points && points.length > 0 && videoEl && scannerSlit) {
                      const vw = videoEl.videoWidth;
                      const vh = videoEl.videoHeight;
                      const cw = scannerSlit.clientWidth;
                      const ch = scannerSlit.clientHeight;

                      const scale = Math.max(cw / vw, ch / vh);
                      const visibleIntrinsicH = ch / scale;
                      const startY = (vh - visibleIntrinsicH) / 2;
                      const endY = startY + visibleIntrinsicH;

                      const margin = visibleIntrinsicH * 0.2; 
                      const safeStartY = startY - margin;
                      const safeEndY = endY + margin;

                      const isInside = points.every(p => {
                          const y = typeof p.getY === 'function' ? p.getY() : p.y;
                          return y >= safeStartY && y <= safeEndY;
                      });

                      if (isInside) handleScanSuccess(result.text);
                  } else {
                      handleScanSuccess(result.text);
                  }
              }
          });

          const videoEl = document.getElementById('video');
          videoEl.addEventListener('loadedmetadata', () => {
              const stream = videoEl.srcObject;
              if (stream) {
                  const track = stream.getVideoTracks()[0];
                  const caps = track.getCapabilities ? track.getCapabilities() : {};
                  
                  if (caps.torch) document.getElementById('torch-btn').style.display = 'block';
                  
                  const advanced = [];
                  if (caps.focusMode && caps.focusMode.includes('continuous')) {
                      advanced.push({ focusMode: "continuous" });
                  }
                  if (advanced.length > 0) {
                      track.applyConstraints({ advanced }).catch(() => {});
                  }
              }
          }, { once: true });
      } catch (error) {
          stopScanning();
      }
    }

    function stopScanning() {
        isScanning = false;
        if (codeReader) codeReader.reset();
        document.getElementById('torch-btn').style.display = 'none';
        document.getElementById('scanner-modal').style.display = 'none';
        torchEnabled = false;
        document.getElementById('torch-btn').classList.remove('active');
    }

    function handleScanSuccess(text) {
        if (navigator.vibrate) navigator.vibrate(200);
        document.getElementById('barcodeInput').value = text;
        saveState();
        stopScanning();
    }

    function toggleTorch(e) {
        e.preventDefault();
        const videoEl = document.getElementById('video');
        const stream = videoEl.srcObject;
        if (stream) {
            const track = stream.getVideoTracks()[0];
            torchEnabled = !torchEnabled;
            track.applyConstraints({ advanced: [{ torch: torchEnabled }] }).catch(() => {});
            const btn = document.getElementById('torch-btn');
            if (torchEnabled) btn.classList.add('active');
            else btn.classList.remove('active');
        }
    }

    function adjustOverlays() {
        const scannerSlit = document.getElementById('scanner-slit');
        const overlayTop = document.getElementById('overlay-top');
        const overlayBottom = document.getElementById('overlay-bottom');
        if (scannerSlit && overlayTop && overlayBottom) {
            const rect = scannerSlit.getBoundingClientRect();
            overlayTop.style.height = `${rect.top}px`;
            overlayBottom.style.top = `${rect.bottom}px`;
        }
    }

    window.addEventListener('resize', () => {
        if(isScanning) adjustOverlays();
    });

    // --- 3. ФОРМАТИРОВАНИЕ ВРЕМЕНИ И ИСТОРИЯ ---
    function formatTimeInput(e) {
      let val = e.target.value.replace(/\D/g, ''); 
      if (val.length > 6) val = val.slice(0, 6);
      
      let formatted = '';
      if (val.length > 0) formatted += val.substring(0, 2);
      if (val.length > 2) formatted += ':' + val.substring(2, 4);
      if (val.length > 4) formatted += ':' + val.substring(4, 6);
      
      e.target.value = formatted;
      saveState();
    }

    function padTimeInput(e) {
      let val = e.target.value.replace(/\D/g, '');
      if (!val) {
        e.target.value = '00:00:00';
      } else {
        val = val.padEnd(6, '0');
        e.target.value = val.substring(0,2) + ':' + val.substring(2,4) + ':' + val.substring(4,6);
      }
      saveState();
    }

    function cleanOldHistory() {
      if (!Array.isArray(savedHistory)) {
        savedHistory = [];
        return false;
      }
      const threeDaysMs = 3 * 24 * 60 * 60 * 1000;
      const now = Date.now();
      const originalLength = savedHistory.length;
      
      savedHistory = savedHistory.filter(item => {
        if (!item || !item.id) return false;
        return (now - item.id) <= threeDaysMs;
      });
      
      return savedHistory.length !== originalLength;

          prep: isPrepActive,

      } catch(e) { console.error("Save state error:", e); }

    function loadState() {
      const applyData = (val) => {
        try {
          const data = JSON.parse(val);
          if (data.history && Array.isArray(data.history)) {
            savedHistory = data.history;
          }
          const wasCleaned = cleanOldHistory();

          if (data.barcode !== undefined) document.getElementById('barcodeInput').value = data.barcode;

          if (data.tpi) document.getElementById('timePerItem').value = data.tpi;

          if (data.start) document.getElementById('startTime').value = data.start;
          if (data.end) document.getElementById('endTime').value = data.end;
          
          renderHistoryList();
          if (data.hasResult) calculate(false);
          
          if (wasCleaned) saveState();
        } catch(e) {}
      };

      try {
        if (tg && tg.CloudStorage) {
          tg.CloudStorage.getItem('calc_data', (err, val) => {
            if (!err && val) applyData(val);
            else {
              const local = localStorage.getItem(storageKey);
              if (local) applyData(local);
            }
          });
        } else {
          const local = localStorage.getItem(storageKey);
          if (local) applyData(local);
        }
      } catch(e) {}
    }

    function initWheel(id, max) {
      const w = document.getElementById(id);
      let html = '<div class="spacer"></div>';
      for (let r = 0; r < 31; r++) {
        for (let i = 0; i <= max; i++) {
          html += `<div>${String(i).padStart(2, '0')}</div>`;
        }
      }
      html += '<div class="spacer"></div>';
      w.innerHTML = html;

      let isScrolling = false;
      const items = max + 1;
      const centerSetIndex = 15;

      w.onscroll = () => {
        let divs = w.querySelectorAll('div:not(.spacer)');
        let idx = Math.round(w.scrollTop / 40);
        
        if (idx < 0) idx = 0;
        if (idx >= divs.length) idx = divs.length - 1;

        divs.forEach((item, i) => {
            if (i === idx) {
                item.classList.add('selected');
            } else {
                item.classList.remove('selected');
            }
        });

        if (!isScrolling) {
          window.requestAnimationFrame(() => {
            let currentSet = Math.floor(idx / items);
            if (currentSet < 5 || currentSet > 25) {
              w.style.scrollBehavior = 'auto';
              let remainder = idx % items;
              w.scrollTop = (centerSetIndex * items + remainder) * 40;
              void w.offsetHeight; 
              w.style.scrollBehavior = 'smooth';
            }
            isScrolling = false;
          });
          isScrolling = true;
        }
      };
    }

    function parseToSec(str) { let p = str.split(':').map(Number); return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : p[0]*3600 + p[1]*60; }
    function formatTime(s) { let h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.round(s%60); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }

    function saveRecord() {
      const q = parseFloat(document.getElementById('quantity').value) || 0;
      if (!q) return;
      const barcode = document.getElementById('barcodeInput').value;
      const tpi = document.getElementById('timePerItem').value;
      const prep = isPrepActive;
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      
      const tpiSec = parseToSec(tpi), prepSec = prep ? 900 : 0, norm = (q * tpiSec) + prepSec;
      const startSec = parseToSec(start), endSec = parseToSec(end);
      
      let eff = 0, clr = "#8b949e";
      let FactT = endSec >= startSec ? endSec - startSec : (86400 - startSec) + endSec;
      
      if (FactT > 0) {
        eff = Math.round((norm / FactT) * 100);
      }
      
      if (eff > 0) {
        if (eff < 65) clr="#f06767";
        else if (eff < 75) clr="#ff9800";
        else if (eff <= 100) clr="#3cd4a0";
        else clr="#f06767";
      }

      const d = new Date();
      const dateStr = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${d.getFullYear()}`;

      const record = { id: Date.now(), barcode, date: dateStr, qty: q, tpi, prep, start, end, eff, clr };
      
      savedHistory.unshift(record);
      visibleHistoryCount = 3; 
      saveState();
      renderHistoryList();
    }

      if (item.date) {
        dateHeader = `<div style="color: #ffffff; font-size: 14px; font-weight: bold; margin-bottom: 8px; text-align: left;">${item.date}</div>`;
      }

      let barcodeHeader = '';
      if (item.barcode) {
        barcodeHeader = `<div style="background: rgba(78, 115, 223, 0.1); border: 1px solid #4e73df; color: #ffffff; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;">${SVG_SCANNER_LARGE} ${item.barcode}</div>`;
      }

      let timeRow = `
        <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(35, 42, 59, 0.5); border: 1px solid #343e50; border-radius: 8px; padding: 12px 15px; margin-bottom: 10px;">
          <div style="text-align: left;">
            <div style="color: #8b949e; font-size: 11px; text-transform: uppercase; margin-bottom: 4px;">${t.labels.start}</div>
            <div style="color: #fff; font-size: 19px; font-weight: bold; letter-spacing: 0.5px;">${item.start}</div>
          </div>
          <div style="color: #454f63; font-size: 20px; font-weight: bold;">➔</div>
          <div style="text-align: right;">
            <div style="color: #8b949e; font-size: 11px; text-transform: uppercase; margin-bottom: 4px;">${t.labels.end}</div>
            <div style="color: #fff; font-size: 19px; font-weight: bold; letter-spacing: 0.5px;">${endStr}</div>
          </div>
        </div>
      `;

      let qtyRow = `
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(35, 42, 59, 0.5); border: 1px solid #343e50; border-radius: 8px; padding: 15px; margin-bottom: 10px;">
          <span style="color: #8b949e; font-size: 13px; text-transform: uppercase; font-weight: 600;">${t.labels.qty}</span>
          <b style="font-size: 26px; color: #ffffff; line-height: 1;">${item.qty}</b>
        </div>
      `;

      let prepRow = '';
      if (item.prep) {
        prepRow = `
          <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(35, 42, 59, 0.5); border: 1px solid #343e50; border-radius: 8px; padding: 15px; margin-bottom: 10px;">
            <span style="color: #8b949e; font-size: 13px; text-transform: uppercase; font-weight: 600;">${t.labels.prep}</span>
            <b style="font-size: 26px; color: #ffffff; line-height: 1;">+15 min</b>
          </div>
        `;
      }

      let efficiencyRow = `
        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(35, 42, 59, 0.5); border: 1px solid #343e50; border-radius: 8px; padding: 15px; margin-bottom: 20px;">
          <span style="color: #8b949e; font-size: 13px; text-transform: uppercase; font-weight: 600;">${t.stats.success}</span>
          <b style="font-size: 32px; color: ${clr}; line-height: 1;">${eff}%</b>
        </div>
      `;

      const html = `<div style="display: flex; flex-direction: column; width: 100%;">
        ${dateHeader}
        ${barcodeHeader}
        ${timeRow}
        ${qtyRow}
        ${prepRow}
        ${efficiencyRow}
        <div class="stat-list" style="border-top: none; padding-top: 0; margin-top: 5px;">
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#3cd4a0"></div>${t.stats.plan}</div><b style="color:#fff;">${plan}</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#f06767"></div>${t.stats.norm}</div><b style="color:#fff;">${formatTime(norm)}</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#9c27b0"></div>${t.stats.qtyPerHour}</div><b style="color:#fff;">${maxQph} шт.</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#ffeb3b"></div>${t.stats.forThisTime}</div><b style="color:#fff;">${neededQty} шт.</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#00bcd4"></div>${t.stats.spent1}</div><b style="color:#fff;">${spentPer}</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#4e73df"></div>${t.stats.spentNorm}</div><b style="color:#fff;">${spent}</b></div>
        </div>
        <button class="btn" style="background: rgba(240, 103, 103, 0.1); border: 1px solid #f06767; color: #f06767; margin-top: 15px; width: 100%; transition: background 0.2s;" onclick="deleteSavedRecord(${item.id})">${t.btns.delete}</button>
      </div>`;
      
      document.getElementById('historyModalContent').innerHTML = html;
      document.getElementById('historyModalOverlay').style.display = 'flex';
    }

    function closeSavedModal() {
      document.getElementById('historyModalOverlay').style.display = 'none';
    }

    function deleteSavedRecord(id) {
      savedHistory = savedHistory.filter(x => x.id !== id);
      saveState();
      renderHistoryList();
      closeSavedModal();
    }

    // --- 7. РАСЧЁТ РЕЗУЛЬТАТОВ ---
    function calculate(save) {
      if (save === undefined) save = true;
      const q = parseFloat(document.getElementById('quantity').value) || 0; if (!q) return;
      const t = tr[currentLang] || tr['Eng'];
      
      const currentBarcode = document.getElementById('barcodeInput').value;
      const tpi = parseToSec(document.getElementById('timePerItem').value), prep = isPrepActive ? 900 : 0, norm = (q * tpi) + prep;
      const startStr = document.getElementById('startTime').value;
      const start = parseToSec(startStr), plan = formatTime((start + norm) % 86400), endStr = document.getElementById('endTime').value;
      
      let eff = 0, spent = "00:00:00", spentPer = "00:00:00", neededQty = 0;
      let FactS = parseToSec(endStr), FactT = FactS >= start ? FactS - start : (86400 - start) + FactS; 
      
      if (FactT > 0) {
        eff = Math.round((norm / FactT) * 100); 
        spent = formatTime(FactT); 
        spentPer = formatTime(Math.max(0, FactT - prep) / q); 
        neededQty = tpi > 0 ? Math.floor(Math.max(0, FactT - prep) / tpi) : 0;
      }
      
      let qph = tpi > 0 ? 3600 / tpi : 0, maxQph = Math.floor(qph);
      let clr = "#8b949e", zn = "---", msg = "", alrt = "";
      if (eff > 0) {
        if (eff < 65) { clr="#f06767"; zn=t.zones.risk; msg=t.msgs.fail; alrt="alert-red"; }
        else if (eff < 75) { clr="#ff9800"; zn=t.zones.orange; msg=t.msgs.push; alrt="alert-orange"; }
        else if (eff <= 100) { clr="#3cd4a0"; zn=t.zones.green; msg=t.msgs.good; alrt="alert-green"; }
        else { clr="#f06767"; zn=t.zones.over; msg=t.msgs.over; alrt="alert-red"; }
      }
      
      const off = 440 - (440 * Math.min(eff, 100)) / 100;
      
      const d = new Date();
      const dateStr = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${d.getFullYear()}`;
      
      let dateHeader = `<div style="color: #ffffff; font-size: 14px; font-weight: bold; margin-bottom: 8px; text-align: left;">${dateStr}</div>`;
      
      let barcodeHeader = '';
      if (currentBarcode) {
        barcodeHeader = `<div style="background: rgba(78, 115, 223, 0.1); border: 1px solid #4e73df; color: #ffffff; padding: 12px; border-radius: 8px; margin-bottom: 25px; font-weight: bold; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px;">${SVG_SCANNER_LARGE} ${currentBarcode}</div>`;
      }

      document.getElementById('result').innerHTML = `<div class="history-card">
        ${dateHeader}
        ${barcodeHeader}
        <div class="chart-container"><svg class="chart-svg" viewBox="0 0 160 160"><circle class="chart-bg" cx="80" cy="80" r="70" /><circle class="chart-fill" cx="80" cy="80" r="70" style="stroke:${clr}; stroke-dasharray:440; stroke-dashoffset:${off};" /></svg><div class="chart-text"><span class="chart-percent" style="color:${clr}">${eff}%</span><span class="chart-label">${t.stats.success}</span></div></div>
        <div class="status-alert ${alrt}">${t.stats.zone} <b>${zn}</b><br>${msg}</div>
        <div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#f06767"></div>${t.legend[0]}</div><div class="legend-item"><div class="legend-dot" style="background:#ff9800"></div>${t.legend[1]}</div><div class="legend-item"><div class="legend-dot" style="background:#3cd4a0"></div>${t.legend[2]}</div></div>
        <div class="stat-list">
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#3cd4a0"></div>${t.stats.plan}</div><b>${plan}</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#f06767"></div>${t.stats.norm}</div><b>${formatTime(norm)}</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#9c27b0"></div>${t.stats.qtyPerHour}</div><b>${maxQph} шт.</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#ffeb3b"></div>${t.stats.forThisTime}</div><b>${neededQty} шт.</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#00bcd4"></div>${t.stats.spent1}</div><b>${spentPer}</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#4e73df"></div>${t.stats.spentNorm}</div><b>${spent}</b></div>
          <div class="stat-item"><div class="item-label"><div class="dot" style="background:#ff9800"></div>${t.stats.fact}</div><b>${endStr}</b></div>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 25px;">
          <button class="btn" style="background: rgba(88, 166, 255, 0.1); border: 1px solid #58a6ff; color: #58a6ff;" onclick="saveRecord()">${t.btns.save}</button>
          <button class="btn" style="background: rgba(240, 103, 103, 0.1); border: 1px solid #f06767; color: #f06767;" onclick="clearState()">${t.btns.clear}</button>
        </div>
      </div>`;
      
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      if (save) saveState();
    }

    document.getElementById('barcodeInput').addEventListener('input', saveState);
    document.getElementById('quantity').addEventListener('input', saveState);

    // --- 8. ФИНАЛЬНЫЙ СТАРТ ---
    function getDeviceLang() {
      try {
        var navLang = '';
        if (typeof window !== 'undefined' && window.navigator) {
            navLang = window.navigator.language || window.navigator.userLanguage || '';
        }
        var lang = navLang.slice(0, 2).toLowerCase();
        var langMap = {
          'ru': 'Pyc', 'be': 'Pyc', 'kk': 'Pyc',
          'en': 'Eng', 'pl': 'Pol', 'es': 'Esp', 'uk': 'Ukr'
        };
        return langMap[lang] || 'Eng'; 
      } catch(e) {
        return 'Eng'; 
      }
    }

    // Запуск приложения
    try {
        setLang(getDeviceLang(), false);
        loadState();
    } catch(e) {
        console.error("Ошибка при запуске:", e);
    }
  </script>
</body>
</html>
