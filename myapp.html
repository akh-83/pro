<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1A222C;--bg2:#141B24;--border:rgba(255,255,255,0.10)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#fff;background:
  radial-gradient(1200px 800px at 85% -10%, rgba(122,60,255,0.25), transparent 60%),
  radial-gradient(900px 700px at -10% 10%, rgba(76,141,255,0.22), transparent 60%),
  radial-gradient(900px 700px at 50% 120%, rgba(62,213,152,0.18), transparent 60%),
  linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:22px 18px 40px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{position:relative;border-radius:26px;padding:18px;min-height:160px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:1px solid rgba(255,255,255,0.10);backdrop-filter:blur(14px);box-shadow:0 20px 40px -20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.12);transition:.25s;overflow:hidden}
.card:hover{transform:translateY(-3px)}
.card:active{transform:translateY(0) scale(0.98)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 80% at 100% 0%, rgba(255,255,255,0.22), transparent 40%);mix-blend-mode:overlay}
.card .icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;background:rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.18);box-shadow:inset 0 2px 0 rgba(255,255,255,0.35), 0 10px 20px -10px rgba(0,0,0,0.6);position:relative;z-index:1}
.card .title{font-size:15px;font-weight:700;margin:0;letter-spacing:-0.01em;position:relative;z-index:1}
.card .desc{font-size:11.5px;color:rgba(255,255,255,0.78);margin-top:4px;position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35;font-weight:500}
.card .arrow{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:10px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;z-index:1}
.card .arrow svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.c-blue{background:linear-gradient(140deg,#4C8DFF,#2F5FE0);box-shadow:0 20px 40px -20px rgba(76,141,255,0.6), inset 0 1px 0 rgba(255,255,255,0.2)}
.c-green{background:linear-gradient(140deg,#3ED598,#1FAE7A);box-shadow:0 20px 40px -20px rgba(62,213,152,0.6), inset 0 1px 0 rgba(255,255,255,0.2)}
.c-orange{background:linear-gradient(140deg,#FF9A3D,#FF6A00);box-shadow:0 20px 40px -20px rgba(255,154,61,0.6), inset 0 1px 0 rgba(255,255,255,0.2)}
.c-purple{background:linear-gradient(140deg,#A770FF,#7A3CFF);box-shadow:0 20px 40px -20px rgba(167,112,255,0.6), inset 0 1px 0 rgba(255,255,255,0.2)}
.c-pink{background:linear-gradient(140deg,#FF5FA2,#E0337E);box-shadow:0 20px 40px -20px rgba(255,95,162,0.6), inset 0 1px 0 rgba(255,255,255,0.2)}
.c-teal{background:linear-gradient(140deg,#38C7C2,#1E8F8B);box-shadow:0 20px 40px -20px rgba(56,199,194,0.6), inset 0 1px 0 rgba(255,255,255,0.2)}
</style>
</head>

const grid = document.getElementById('grid');
APPS.forEach(a=>{
  const el = document.createElement('div');
  el.className = 'card ' + a.color;
  const desc = a.description ? '<p class="desc">' + a.description.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) + '</p>' : '';
  el.innerHTML = '<div class="arrow"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></div>'
    + '<div class="icon">' + a.icon + '</div>'
    + '<div><p class="title">' + a.name.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) + '</p>'
    + desc + '</div>';
  el.addEventListener('click', ()=>{
    try{
      const parts = a.file.dataUrl.split(',');
      const mime = /:(.*?);/.exec(parts[0])[1];
      const bin = atob(parts[1]);
      const buf = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
      const blob = new Blob([buf],{type:mime});
      const url = URL.createObjectURL(blob);
      const w = window.open(url,'_blank');
      if(!w){ const x=document.createElement('a'); x.href=url; x.download=a.file.originalName; x.click(); }
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    }catch(e){ alert('Не удалось открыть'); }
  });
  grid.appendChild(el);
});
</script>
