<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кино — Продвинутый Поиск</title>
    <style>
        /* Базовая темная палитра */
        :root {
            --bg-page: #1a1d24; 
            --bg-card: #2c303a; 
            --text-primary: #ffffff; 
            --text-secondary: #ADB5BD; 
            --border-color: #3F4652; 
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            max-width: 750px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Неоновые градиенты */
        .gradient-text {
            background: linear-gradient(90deg, #4dc0ed, #d06ffd, #f9a882);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            font-weight: bold;
            display: inline-block;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        /* Универсальная градиентная кнопка-ссылка */
        .gradient-border-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            border: 2px solid transparent;
            border-radius: 40px; 
            background-image: linear-gradient(var(--bg-card), var(--bg-card)), 
                              linear-gradient(90deg, #4dc0ed, #d06ffd, #f9a882);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            outline: none;
            white-space: nowrap;
        }

        .gradient-border-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(208, 111, 253, 0.3); 
        }

        .play-icon { width: 22px; height: 22px; }

        /* Панель фильтров */
        .filters-wrapper {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px var(--shadow-color);
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .filters-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filters-wrapper input, 
        .filters-wrapper select {
            flex: 1;
            min-width: 130px;
            font-size: 16px;
            padding: 12px 15px;
            background: var(--bg-page);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .filters-wrapper input:focus, 
        .filters-wrapper select:focus {
            border-color: #d06ffd;
        }

        .search-btn-container {
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }

        .search-btn-container .gradient-border-btn {
            width: 100%;
            max-width: 250px;
        }

        /* === НОВЫЙ ДИЗАЙН СПИСКА РЕЗУЛЬТАТОВ (ПО МАКЕТУ) === */
        .results-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .result-item {
            background: var(--bg-card);
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 16px;
            /* Карточка теперь колонка: сверху контент, снизу кнопка */
            display: flex;
            flex-direction: column;
            gap: 16px; 
            box-shadow: 0 4px 10px var(--shadow-color);
        }

        /* Верхняя часть карточки (Постер + Текст) */
        .card-content {
            display: flex;
            flex-direction: row;
            gap: 16px;
        }

        /* Миниатюра фильма */
        .film-poster {
            width: 100px;
            height: 145px;
            object-fit: cover;
            border-radius: 12px;
            background-color: #4a4d57; /* Цвет заглушки, если нет фото */
            flex-shrink: 0;
        }

        /* Блок с текстом */
        .film-details {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .film-title { 
            font-weight: bold; 
            font-size: 18px; 
            color: var(--text-primary); 
            margin-bottom: 12px; /* Отступ после заголовка как на макете */
        }

        /* Список характеристик (Жанр, Год, Рейтинг) */
        .film-meta-list {
            display: flex;
            flex-direction: column;
            gap: 8px; /* Расстояние между строками */
        }

        .film-meta { 
            color: var(--text-secondary); 
            font-size: 13px; 
            line-height: 1.4;
        }

        /* Кнопка внутри карточки на 100% ширины */
        .full-width-btn {
            width: 100%;
        }

        .loader { color: var(--text-secondary); font-style: italic; text-align: center; }

        /* Кнопка "Загрузить еще" */
        .load-more-container {
            display: none; 
            justify-content: center;
            margin-top: 25px;
            margin-bottom: 50px;
        }
        .load-more-container .gradient-border-btn {
            width: 100%;
            max-width: 250px;
        }
    </style>
</head>
<body>

    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#d53bf9" /> 
                <stop offset="100%" stop-color="#7366ff" /> 
            </linearGradient>
        </defs>
    </svg>

    <h1><span class="gradient-text">🎬 Поиск Кино</span></h1>

    <div class="filters-wrapper">
        <input type="text" id="searchInput" placeholder="Название (например: Дюна)">
        
        <div class="filters-row">
            <select id="genreSelect">
                <option value="">Все жанры</option>
            </select>
            
            <input type="number" id="yearSelect" placeholder="Год (напр. 2024)" min="1900" max="2030">
        </div>

        <div class="search-btn-container">
            <button class="gradient-border-btn" onclick="searchKinopoisk(false)">
                <span class="gradient-text" style="font-size: 16px;">Найти фильмы</span>
            </button>
        </div>
    </div>

    <ul id="resultsList" class="results-list"></ul>

    <div class="load-more-container" id="loadMoreContainer">
        <button class="gradient-border-btn" id="loadMoreBtn" onclick="searchKinopoisk(true)">
            <span class="gradient-text" style="font-size: 15px;">Показать ещё 10</span>
        </button>
    </div>

    <script>
        const API_KEY = "b0ae37d0-74af-4ae7-a825-826d1c3a3bbf"; 
        
        let allFetchedFilms = [];   
        let nextLocalIndex = 0;     
        let currentApiPage = 1;     
        let totalApiPages = 1;      
        let isFetching = false;     

        // Загрузка жанров при старте
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch("https://kinopoiskapiunofficial.tech/api/v2.2/films/filters", {
                    headers: { 'X-API-KEY': API_KEY }
                });
                const data = await res.json();
                const genreSelect = document.getElementById("genreSelect");
                
                const validGenres = data.genres.filter(g => g.genre);
                validGenres.sort((a,b) => a.genre.localeCompare(b.genre, 'ru'));
                
                validGenres.forEach(g => {
                    const option = document.createElement("option");
                    option.value = g.id; 
                    option.text = g.genre.charAt(0).toUpperCase() + g.genre.slice(1);
                    genreSelect.appendChild(option);
                });
            } catch(e) {
                console.error("Не удалось подгрузить жанры", e);
            }
        });

        // Функция поиска
        async function searchKinopoisk(isLoadMore = false) {
            if (isFetching) return; 

            const keyword = document.getElementById("searchInput").value.trim();
            const genre = document.getElementById("genreSelect").value;
            const year = document.getElementById("yearSelect").value.trim();
            
            if (!keyword && !genre && !year) {
                alert("Пожалуйста, введите название, выберите жанр или год выпуска.");
                return;
            }

            const resultsList = document.getElementById("resultsList");
            const loadMoreBtnContainer = document.getElementById("loadMoreContainer");
            const loadMoreBtn = document.getElementById("loadMoreBtn");

            if (!isLoadMore) {
                resultsList.innerHTML = "<li class='loader'>Магия кино... Анализируем базу...</li>";
                allFetchedFilms = [];
                nextLocalIndex = 0;
                currentApiPage = 1;
                totalApiPages = 1;
                loadMoreBtnContainer.style.display = "none";
            }

            if (nextLocalIndex + 10 > allFetchedFilms.length && currentApiPage <= totalApiPages) {
                isFetching = true;
                if (isLoadMore) {
                    loadMoreBtn.innerHTML = "<span class='gradient-text'>Загрузка...</span>";
                }

                let url = `https://kinopoiskapiunofficial.tech/api/v2.2/films?page=${currentApiPage}`;
                if (keyword) url += `&keyword=${encodeURIComponent(keyword)}`;
                if (genre) url += `&genres=${genre}`;
                if (year) url += `&yearFrom=${year}&yearTo=${year}`;

                try {
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'X-API-KEY': API_KEY,
                            'Content-Type': 'application/json',
                        },
                    });

                    if (!response.ok) throw new Error(`Ошибка сервера`);
                    const data = await response.json();
                    
                    totalApiPages = data.totalPages || 0;
                    const newItems = data.items || data.films || [];
                    allFetchedFilms = allFetchedFilms.concat(newItems);
                    currentApiPage++; 
                    
                } catch (error) {
                    if (!isLoadMore) {
                        resultsList.innerHTML = `<li style="color: #f9a882; text-align: center;">Ошибка сети! Проверьте API-ключ.</li>`;
                    }
                    loadMoreBtn.innerHTML = "<span class='gradient-text'>Показать ещё 10</span>";
                    isFetching = false;
                    return;
                }
            }

            if (!isLoadMore) {
                resultsList.innerHTML = "";
            }

            const batch = allFetchedFilms.slice(nextLocalIndex, nextLocalIndex + 10);
            
            if (batch.length === 0 && nextLocalIndex === 0) {
                resultsList.innerHTML = "<li style='text-align: center; list-style: none;'>К сожалению, по этим фильтрам ничего не найдено.</li>";
                loadMoreBtnContainer.style.display = "none";
                isFetching = false;
                return;
            }

            batch.forEach(film => {
                const li = document.createElement("li");
                li.className = "result-item";
                
                const title = film.nameRu || film.nameEn || film.nameOriginal || "Без названия";
                
                const genresString = film.genres && film.genres.length > 0 
                    ? film.genres.map(g => g.genre).join(', ') 
                    : 'не указан';

                const filmId = film.kinopoiskId || film.filmId || film.id;
                const targetUrl = `https://kinokino.vip/film/${filmId}/`;

                // Картинка постера
                const posterImg = film.posterUrlPreview || 'data:image/gif;base64,R0lGODlhAQABAIAAAMLCwgAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw=='; // прозрачная/серая заглушка

                // Генерируем блок рейтинга только если он есть
                const ratingHtml = film.ratingKinopoisk 
                    ? `<div class="film-meta">РЕЙТИНГ: ${film.ratingKinopoisk}</div>` 
                    : '';

                // НОВАЯ ВЕРСТКА: Постер слева, текст справа, кнопка на всю ширину снизу
                li.innerHTML = `
                    <div class="card-content">
                        <img src="${posterImg}" class="film-poster" alt="Постер" loading="lazy">
                        <div class="film-details">
                            <div class="film-title">${title}</div>
                            <div class="film-meta-list">
                                <div class="film-meta">ЖАНР: ${genresString}</div>
                                <div class="film-meta">ГОД: ${film.year || 'неизвестен'}</div>
                                ${ratingHtml}
                            </div>
                        </div>
                    </div>
                    <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="gradient-border-btn full-width-btn">
                        <svg class="play-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="50" r="40" fill="none" stroke="url(#iconGradient)" stroke-width="8"/>
                            <path d="M38 32 L38 68 L72 50 Z" fill="none" stroke="url(#iconGradient)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
                        </svg>
                        <span class="gradient-text" style="font-size: 15px;">Открыть</span>
                    </a>
                `;
                resultsList.appendChild(li);
            });

            nextLocalIndex += batch.length;

            if (nextLocalIndex < allFetchedFilms.length || currentApiPage <= totalApiPages) {
                loadMoreBtnContainer.style.display = "flex";
                loadMoreBtn.innerHTML = "<span class='gradient-text'>Показать ещё 10</span>";
            } else {
                loadMoreBtnContainer.style.display = "none";
            }
            
            isFetching = false;
        }

        // Поиск по нажатию клавиши Enter
        document.querySelectorAll('.filters-wrapper input, .filters-wrapper select').forEach(element => {
            element.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    searchKinopoisk(false);
                }
            });
        });
    </script>

</body>
</html>
