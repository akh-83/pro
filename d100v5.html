<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dice Game</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1A222C;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(236, 72, 153, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(34, 197, 94, 0.10) 0%, transparent 50%);
    min-height: 100vh;
    color: #FFFFFF;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
  }

  .dashboard {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-bottom: 32px;
  }

  .header {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 18px 20px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.25), rgba(168, 85, 247, 0.25));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 26px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .header-icon {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, #FFD93D, #FF6B6B);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    box-shadow: 0 6px 16px rgba(255, 107, 107, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
  }

  .header h1 {
    font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #FFFFFF, #C7D2FE);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }

  .balance-card {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.22), rgba(16, 185, 129, 0.18));
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(52, 211, 153, 0.3);
    border-radius: 26px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(52, 211, 153, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    position: relative; overflow: hidden;
  }

  .balance-card::before {
    content: ''; position: absolute; top: -50%; right: -20%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(52, 211, 153, 0.25), transparent 70%);
    pointer-events: none;
  }

  .balance-label {
    font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.7);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }

  .balance-value {
    font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 8px;
  }

  .balance-value .currency {
    font-size: 14px; font-weight: 700; color: rgba(255, 255, 255, 0.75);
    background: rgba(255, 255, 255, 0.1); padding: 4px 10px; border-radius: 10px;
  }

  .balance-actions { display: flex; gap: 10px; margin-top: 16px; }

  .balance-actions button {
    flex: 1; padding: 12px; border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.08); color: #FFFFFF;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.25s ease; backdrop-filter: blur(10px);
  }

  .balance-actions button:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  }

  .balance-actions button.withdraw {
    background: linear-gradient(135deg, rgba(249, 115, 22, 0.35), rgba(234, 88, 12, 0.25));
    border-color: rgba(251, 146, 60, 0.4);
  }

  .balance-actions button.deposit {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.35), rgba(37, 99, 235, 0.25));
    border-color: rgba(96, 165, 250, 0.4);
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 26px; padding: 20px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .dice-result-display { text-align: center; padding: 10px 0 16px; }

  .dice-result-number {
    font-size: 64px; font-weight: 900; letter-spacing: -2px;
    background: linear-gradient(135deg, #FFFFFF, #C7D2FE);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1; transition: all 0.1s ease;
  }

  .dice-result-number.win-flash { animation: winFlash 0.3s ease; }
  .dice-result-number.lose-flash { animation: loseFlash 0.3s ease; }

  @keyframes winFlash {
    0%, 100% { filter: drop-shadow(0 0 0 transparent); }
    50% { filter: drop-shadow(0 0 20px rgba(52, 211, 153, 0.8)); }
  }

  @keyframes loseFlash {
    0%, 100% { filter: drop-shadow(0 0 0 transparent); }
    50% { filter: drop-shadow(0 0 20px rgba(248, 113, 113, 0.8)); }
  }

  .range-card {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.18), rgba(168, 85, 247, 0.15));
    backdrop-filter: blur(20px); border: 1px solid rgba(167, 139, 250, 0.25);
    border-radius: 26px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    position: relative;
  }

  .range-bar-container { position: relative; padding: 24px 0; }

  .range-bar {
    position: relative; height: 32px; border-radius: 12px;
    overflow: hidden;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
  }

  .bar-segments {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; gap: 2px; padding: 0 2px;
  }

  .bar-segment { flex: 1; height: 100%; border-radius: 2px; }
  .bar-segment.win-segment { background: #3B82F6; }
  .bar-segment.lose-segment { background: #EF4444; }

  .range-thumb {
    position: absolute; top: 50%;
    left: var(--thumb-pos, 50%);
    transform: translate(-50%, -50%);
    width: 64px; height: 40px;
    z-index: 10; cursor: grab;
    transition: left 0.08s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 4px 12px rgba(251, 191, 36, 0.6)) drop-shadow(0 0 0 3px rgba(251, 191, 36, 0.35));
  }

  .range-thumb:active {
    cursor: grabbing;
    transform: translate(-50%, -50%) scale(1.1);
  }

  .range-thumb svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .range-thumb.animating { transition: left 0.05s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
  .range-thumb.returning { transition: left 0.05s cubic-bezier(0.34, 1.56, 0.64, 1); }

  .range-labels-row {
    display: flex; justify-content: space-between;
    font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, 0.55);
    margin-top: 10px; letter-spacing: 0.5px;
  }

  .range-labels-row span { position: relative; }
  .range-labels-row span::before {
    content: ''; position: absolute; top: -6px; left: 50%;
    transform: translateX(-50%); width: 1px; height: 4px;
    background: rgba(255, 255, 255, 0.3);
  }

  .mode-toggle {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-top: 14px;
  }

  .mode-btn {
    padding: 10px 20px; border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.05);
    color: rgba(255, 255, 255, 0.6);
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all 0.25s ease;
    display: flex; align-items: center; gap: 6px;
  }

  .mode-btn:hover { background: rgba(255, 255, 255, 0.1); }

  .mode-btn.active {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(168, 85, 247, 0.3));
    border-color: rgba(167, 139, 250, 0.5); color: #FFFFFF;
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
  }

  .mode-icon { font-size: 16px; font-weight: 800; }

  .payout-block {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.12), rgba(16, 185, 129, 0.08));
    backdrop-filter: blur(20px); border: 1px solid rgba(52, 211, 153, 0.2);
    border-radius: 22px; padding: 18px 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .payout-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }

  .payout-main { flex: 1; }

  .payout-label {
    font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px;
  }

  .payout-value {
    font-size: 32px; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(135deg, #FBBF24, #F59E0B);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1;
  }

  .payout-value .x-mark { font-size: 24px; font-weight: 800; }

  .payout-divider {
    width: 1px; height: 50px;
    background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.15), transparent);
  }

  .payout-stats { flex: 1.2; display: flex; flex-direction: column; gap: 10px; }

  .payout-stat {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }

  .payout-stat-label {
    font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.55);
  }

  .payout-stat-value { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
  .payout-stat-value.win-amount { color: #34D399; }
  .payout-stat-value.chance-amount { color: #60A5FA; }

  .bet-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 16px; flex-wrap: wrap;
  }

  .bet-row label {
    font-size: 13px; font-weight: 600;
    color: rgba(255, 255, 255, 0.75); white-space: nowrap;
  }

  .bet-input-wrap {
    flex: 1; min-width: 120px; display: flex; align-items: center;
    background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px; padding: 4px; transition: all 0.25s ease;
  }

  .bet-input-wrap:focus-within {
    border-color: rgba(167, 139, 250, 0.5);
    box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
  }

  .bet-input-wrap input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 10px 12px; min-width: 0;
  }

  .bet-input-wrap .unit {
    font-size: 12px; font-weight: 700;
    color: rgba(255, 255, 255, 0.5); padding-right: 10px;
  }

  .bet-multipliers { display: flex; gap: 6px; }

  .bet-multipliers button {
    min-width: 48px; height: 48px; border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
    color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all 0.2s ease; padding: 0 12px;
  }

  .bet-multipliers button:hover {
    background: linear-gradient(135deg, rgba(167, 139, 250, 0.3), rgba(99, 102, 241, 0.2));
    border-color: rgba(167, 139, 250, 0.5); transform: translateY(-1px);
  }

  .stats-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px;
  }

  .stat-item {
    background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px; padding: 14px;
  }

  .stat-item label {
    display: block; font-size: 11px; font-weight: 600;
    color: rgba(255, 255, 255, 0.55); text-transform: uppercase;
    letter-spacing: 0.8px; margin-bottom: 6px;
  }

  .stat-item input, .stat-item .value {
    width: 100%; background: transparent; border: none; outline: none;
    color: #FFFFFF; font-family: inherit; font-size: 18px;
    font-weight: 800; letter-spacing: -0.3px;
  }

  .controls-row { display: flex; gap: 10px; margin-top: 14px; }

  .control-btn {
    flex: 1; padding: 14px; border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05); color: #FFFFFF;
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all 0.25s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }

  .control-btn:hover {
    background: rgba(255, 255, 255, 0.1); transform: translateY(-1px);
  }

  .control-btn.active {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.3), rgba(16, 185, 129, 0.2));
    border-color: rgba(52, 211, 153, 0.5);
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
  }

  .roll-btn {
    margin-top: 18px; width: 100%; padding: 18px; border-radius: 20px; border: none;
    background: linear-gradient(135deg, #6366F1, #8B5CF6, #EC4899);
    color: #FFFFFF; font-family: inherit; font-size: 18px;
    font-weight: 800; letter-spacing: 0.5px; cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 10px 30px rgba(139, 92, 246, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.1) inset, inset 0 1px 0 rgba(255, 255, 255, 0.25);
    position: relative; overflow: hidden;
  }

  .roll-btn::before {
    content: ''; position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.6s ease;
  }

  .roll-btn:hover::before { left: 100%; }

  .roll-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 40px rgba(139, 92, 246, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.15) inset, inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .roll-btn:active { transform: translateY(0); }

  .history-card {
    background: linear-gradient(135deg, rgba(249, 115, 22, 0.15), rgba(236, 72, 153, 0.12));
    backdrop-filter: blur(20px); border: 1px solid rgba(251, 146, 60, 0.2);
    border-radius: 26px; padding: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .history-title {
    font-size: 16px; font-weight: 800; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px; letter-spacing: -0.3px;
  }

  .history-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }

  .history-table thead th {
    font-size: 10px; font-weight: 700; color: rgba(255, 255, 255, 0.55);
    text-transform: uppercase; letter-spacing: 1px;
    text-align: left; padding: 6px 12px;
  }

  .history-table tbody tr {
    background: rgba(0, 0, 0, 0.25); border-radius: 12px;
    transition: all 0.2s ease;
  }

  .history-table tbody tr:hover {
    background: rgba(0, 0, 0, 0.35); transform: translateX(2px);
  }

  .history-table tbody td {
    padding: 12px; font-size: 13px; font-weight: 600;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .history-table tbody td:first-child {
    border-left: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px 0 0 12px;
  }

  .history-table tbody td:last-child {
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 0 12px 12px 0; text-align: right;
  }

  .result-win { color: #34D399; font-weight: 800; }
  .result-lose { color: #F87171; font-weight: 800; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dashboard > * { animation: fadeInUp 0.5s ease backwards; }
  .dashboard > *:nth-child(1) { animation-delay: 0.05s; }
  .dashboard > *:nth-child(2) { animation-delay: 0.10s; }
  .dashboard > *:nth-child(3) { animation-delay: 0.15s; }
  .dashboard > *:nth-child(4) { animation-delay: 0.20s; }
  .dashboard > *:nth-child(5) { animation-delay: 0.25s; }
  .dashboard > *:nth-child(6) { animation-delay: 0.30s; }
  .dashboard > *:nth-child(7) { animation-delay: 0.35s; }
  .dashboard > *:nth-child(8) { animation-delay: 0.40s; }

  /* ===== POPUP NOTIFICATION ===== */
  .popup-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    padding: 20px;
  }

  .popup-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .popup-content {
    background: linear-gradient(135deg, #1E293B, #0F172A);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 360px;
    width: 100%;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
  }

  .popup-overlay.active .popup-content {
    transform: scale(1) translateY(0);
  }

  .popup-icon {
    width: 64px; height: 64px; border-radius: 50%;
    margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }

  .popup-icon.error {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.3), rgba(220, 38, 38, 0.2));
    border: 1px solid rgba(239, 68, 68, 0.4);
  }

  .popup-icon.warning {
    background: linear-gradient(135deg, rgba(251, 191, 36, 0.3), rgba(245, 158, 11, 0.2));
    border: 1px solid rgba(251, 191, 36, 0.4);
  }

  .popup-icon.success {
    background: linear-gradient(135deg, rgba(52, 211, 153, 0.3), rgba(16, 185, 129, 0.2));
    border: 1px solid rgba(52, 211, 153, 0.4);
  }

  .popup-title {
    font-size: 20px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px;
  }

  .popup-message {
    font-size: 14px; color: rgba(255, 255, 255, 0.7); line-height: 1.5; margin-bottom: 24px;
  }

  .popup-actions { display: flex; gap: 10px; }

  .popup-btn {
    flex: 1; padding: 14px 20px; border-radius: 14px; border: none;
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.25s ease;
  }

  .popup-btn.primary {
    background: linear-gradient(135deg, #6366F1, #8B5CF6);
    color: #FFFFFF; box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
  }

  .popup-btn.primary:hover {
    transform: translateY(-2px); box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
  }

  .popup-btn.secondary {
    background: rgba(255, 255, 255, 0.08); color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .popup-btn.secondary:hover { background: rgba(255, 255, 255, 0.12); }

  .popup-btn.deposit {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.4), rgba(37, 99, 235, 0.3));
    color: #FFFFFF; border: 1px solid rgba(96, 165, 250, 0.4);
  }

  .popup-btn.deposit:hover {
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.5), rgba(37, 99, 235, 0.4));
    transform: translateY(-2px);
  }

  /* ===== AUTO ROLL SETTINGS MODAL ===== */
  .settings-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    padding: 20px;
  }

  .settings-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .settings-modal {
    background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 28px;
    padding: 28px 24px;
    max-width: 400px;
    width: 100%;
    box-shadow:
      0 24px 80px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-height: 90vh;
    overflow-y: auto;
  }

  .settings-overlay.active .settings-modal {
    transform: scale(1) translateY(0);
  }

  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    const popupOverlay = document.getElementById('popupOverlay');
    const popupIcon = document.getElementById('popupIcon');
    const popupTitle = document.getElementById('popupTitle');
    const popupMessage = document.getElementById('popupMessage');
    const popupActions = document.getElementById('popupActions');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const autoStatus = document.getElementById('autoStatus');
    const autoStatusText = document.getElementById('autoStatusText');
    const settingsActionBtn = document.getElementById('settingsActionBtn');
    const settingsActionText = document.getElementById('settingsActionText');
    const lossMultiplierRow = document.getElementById('lossMultiplierRow');
    const lossMultiplierInput = document.getElementById('lossMultiplier');

    // ===== SAVE/LOAD FUNCTIONS =====
    function saveGameData() {
      const data = {
        balance,
        betAmount,
        winChance,
        gameMode,
        autoSettings,
        sessionStats,
        gameHistory
      };
      localStorage.setItem('diceGameData', JSON.stringify(data));
    }

    function loadGameData() {
      const saved = localStorage.getItem('diceGameData');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          balance = data.balance || 100.00;
          betAmount = data.betAmount || 1.00;
          winChance = data.winChance || 50.00;
          gameMode = data.gameMode || 'under';
          autoSettings = { ...autoSettings, ...data.autoSettings };
          sessionStats = data.sessionStats || { rounds: 0, wins: 0, losses: 0 };
          gameHistory = data.gameHistory || [];
          
          // Update UI
          betAmountEl.value = betAmount.toFixed(2);
          winChanceEl.value = winChance.toFixed(2);
          lossMultiplierInput.value = autoSettings.lossMultiplier;
          
          // Render history
          renderHistory();
          
          // Update mode buttons
          if (gameMode === 'under') {
            modeUnderBtn.classList.add('active');
            modeOverBtn.classList.remove('active');
          } else {
            modeOverBtn.classList.add('active');
            modeUnderBtn.classList.remove('active');
          }
          
          // Update speed indicator
          updateSpeedIndicator();
        } catch (e) {
          console.error('Error loading saved data:', e);
        }
      }
    }

    function renderHistory() {
      historyBodyEl.innerHTML = '';
      gameHistory.slice(0, 10).forEach(record => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${record.bet.toFixed(2)}</td>
          <td class="${record.won ? 'result-win' : 'result-lose'}">${record.won ? 'WIN' : 'LOSE'} (${record.roll.toFixed(2)})</td>
          <td class="${record.won ? 'result-win' : 'result-lose'}">${record.won ? '+' + record.profit.toFixed(2) : '-' + record.bet.toFixed(2)}</td>
        `;
        historyBodyEl.appendChild(row);
      });
    }

    function buildSegments() {
      const segments = document.getElementById('barSegments');
      segments.innerHTML = '';
      for (let i = 0; i < 100; i++) {
        const seg = document.createElement('div');
        seg.className = 'bar-segment';
        segments.appendChild(seg);
      }
    }

    function calculateGameValues() {
      const multiplier = 99 / winChance;
      const profitOnWin = (betAmount * multiplier) - betAmount;
      let payoutPoint;

      if (gameMode === 'under') {
        payoutPoint = winChance;
      } else {
        payoutPoint = 100 - winChance;
      }

      return { multiplier, payoutPoint, profitOnWin };
    }

    function updateBarColors() {
      const segments = document.querySelectorAll('#barSegments .bar-segment');
      const values = calculateGameValues();
      const payoutIndex = Math.round(values.payoutPoint);

      segments.forEach((seg, i) => {
        if (gameMode === 'under') {
          seg.className = 'bar-segment ' + (i < payoutIndex ? 'win-segment' : 'lose-segment');
        } else {
          seg.className = 'bar-segment ' + (i < payoutIndex ? 'lose-segment' : 'win-segment');
        }
      });
    }

    function updateDisplay() {
      const values = calculateGameValues();

      balanceEl.textContent = balance.toFixed(2);
      payoutMultiplierEl.textContent = values.multiplier.toFixed(2);
      profitOnWinEl.textContent = values.profitOnWin.toFixed(2);
      potentialWinEl.textContent = values.profitOnWin.toFixed(2) + ' USDT';
      chanceDisplayEl.textContent = winChance.toFixed(2) + '%';

      rangeBarContainer.style.setProperty('--thumb-pos', values.payoutPoint + '%');
      rangeThumb.style.left = values.payoutPoint + '%';

      updateBarColors();
      updateSessionStats();
      saveGameData();
    }

    function setMode(mode) {
      gameMode = mode;
      if (mode === 'under') {
        modeUnderBtn.classList.add('active');
        modeOverBtn.classList.remove('active');
      } else {
        modeOverBtn.classList.add('active');
        modeUnderBtn.classList.remove('active');
      }
      updateDisplay();
    }

    function halveBet() {
      betAmount = Math.max(0.01, betAmount / 2);
      betAmountEl.value = betAmount.toFixed(2);
      updateDisplay();
    }

    function doubleBet() {
      betAmount = betAmount * 2;
      betAmountEl.value = betAmount.toFixed(2);
      updateDisplay();
    }

    betAmountEl.addEventListener('input', (e) => {
      betAmount = parseFloat(e.target.value) || 0;
      if (betAmount > balance && balance > 0) {
        betAmount = balance;
        betAmountEl.value = betAmount.toFixed(2);
      }
      updateDisplay();
    });

    winChanceEl.addEventListener('input', (e) => {
      winChance = parseFloat(e.target.value) || 50;
      winChance = Math.max(1, Math.min(98, winChance));
      updateDisplay();
    });

    lossMultiplierInput.addEventListener('input', (e) => {
      autoSettings.lossMultiplier = parseFloat(e.target.value) || 2;
      updateDisplay();
    });

    // ===== SPEED SELECTION =====
    function selectSpeed(el) {
      const speed = el.dataset.speed;
      
      document.querySelectorAll('.speed-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      el.classList.add('selected');
      el.querySelector('input[type="radio"]').checked = true;
      
      autoSettings.speed = speed;
      updateSpeedIndicator();
      updateDisplay();
    }

    function updateSpeedIndicator() {
      if (autoRollEnabled) {
        const speedText = autoSettings.speed === 'max' ? 'MAX' : `${autoSettings.speed}x`;
        speedIndicator.textContent = speedText;
        speedIndicator.style.display = 'inline-flex';
      } else {
        speedIndicator.style.display = 'none';
      }
    }

    // ===== AUTO ROLL SETTINGS =====
    function openAutoSettings() {
      settingsOverlay.classList.add('active');
      updateSettingsUI();
    }

    function closeAutoSettings() {
      settingsOverlay.classList.remove('active');
    }

    function selectRadio(el) {
      const group = el.dataset.group;
      const value = el.dataset.value;

      document.querySelectorAll(`.radio-option[data-group="${group}"]`).forEach(opt => {
        opt.classList.remove('selected');
      });
      el.classList.add('selected');
      el.querySelector('input[type="radio"]').checked = true;

      if (group === 'onLoss') {
        autoSettings.onLoss = value;
        lossMultiplierRow.style.display = value === 'custom' ? 'flex' : 'none';
      } else if (group === 'onWin') {
        autoSettings.onWin = value;
      }

      updateSettingsUI();
    }

    function updateSettingsUI() {
      if (autoRollEnabled) {
        autoStatus.classList.add('active');
        const speedText = autoSettings.speed === 'max' ? 'MAX' : `${autoSettings.speed}x`;
        autoStatusText.textContent = `Auto rolling... Speed ${speedText}`;
        settingsActionBtn.className = 'settings-btn stop';
        settingsActionText.textContent = '⏹ Stop';
      } else {
        autoStatus.classList.remove('active');
        autoStatusText.textContent = 'Ready to start';
        settingsActionBtn.className = 'settings-btn start';
        settingsActionText.textContent = '▶ Start';
      }

      document.querySelectorAll('.radio-option').forEach(opt => {
        const group = opt.dataset.group;
        const value = opt.dataset.value;
        if (group === 'onLoss' && value === autoSettings.onLoss) {
          opt.classList.add('selected');
          opt.querySelector('input').checked = true;
        } else if (group === 'onWin' && value === autoSettings.onWin) {
          opt.classList.add('selected');
          opt.querySelector('input').checked = true;
        }
      });

      document.querySelectorAll('.speed-option').forEach(opt => {
        if (opt.dataset.speed == autoSettings.speed) {
          opt.classList.add('selected');
          opt.querySelector('input').checked = true;
        }
      });

      lossMultiplierRow.style.display = autoSettings.onLoss === 'custom' ? 'flex' : 'none';
      lossMultiplierInput.value = autoSettings.lossMultiplier;
    }

    function toggleAutoFromSettings() {
      if (autoRollEnabled) {
        stopAutoRoll();
      } else {
        startAutoRollFromSettings();
        // Auto-close settings modal after starting
        setTimeout(() => {
          closeAutoSettings();
        }, 300);
      }
      updateSettingsUI();
      updateAutoRollButton();
    }

    function startAutoRollFromSettings() {
      if (betAmount <= 0) {
        showPopup('warning', '⚠️ Invalid Bet', 'Please enter a valid bet amount.', [
          { text: 'OK', style: 'primary' }
        ]);
        return;
      }

      if (betAmount > balance) {
        showPopup('warning', '⚠️ Insufficient Balance', 'Your bet exceeds your balance.', [
          { text: 'OK', style: 'primary' }
        ]);
        return;
      }

      autoSettings.baseBet = betAmount;
      sessionStats = { rounds: 0, wins: 0, losses: 0 };

      autoRollEnabled = true;
      updateSpeedIndicator();

      rollDice(true);

      if (autoRollInterval) clearInterval(autoRollInterval);
      const interval = speedIntervals[autoSettings.speed];
      autoRollInterval = setInterval(() => {
        if (!isRolling && autoRollEnabled) {
          rollDice(true);
        }
      }, interval);
    }

    function stopAutoRoll() {
      autoRollEnabled = false;
      if (autoRollInterval) {
        clearInterval(autoRollInterval);
        autoRollInterval = null;
      }
      updateSpeedIndicator();
      updateDisplay();
    }

    function updateAutoRollButton() {
      if (autoRollEnabled) {
        autoRollBtn.classList.add('active');
        const speedText = autoSettings.speed === 'max' ? 'MAX' : `${autoSettings.speed}x`;
        autoRollBtn.innerHTML = `⏹ Stop Auto <span class="speed-indicator">${speedText}</span>`;
      } else {
        autoRollBtn.classList.remove('active');
        autoRollBtn.innerHTML = 'Auto Roll <span id="speedIndicator" class="speed-indicator" style="display: none;">1x</span>';
      }
    }

    function updateSessionStats() {
      document.getElementById('statRounds').textContent = sessionStats.rounds;
      document.getElementById('statWins').textContent = sessionStats.wins;
      document.getElementById('statLosses').textContent = sessionStats.losses;
    }

    // ===== POPUP FUNCTIONS =====
    function showPopup(type, title, message, actions = []) {
      popupIcon.className = 'popup-icon ' + type;
      const icons = { error: '❌', warning: '⚠️', success: '✅', info: 'ℹ️' };
      popupIcon.textContent = icons[type] || '⚠️';
      popupTitle.textContent = title;
      popupMessage.textContent = message;
      popupActions.innerHTML = '';
      actions.forEach(action => {
        const btn = document.createElement('button');
        btn.className = 'popup-btn ' + (action.style || 'secondary');
        btn.textContent = action.text;
        btn.onclick = () => { closePopup(); if (action.callback) action.callback(); };
        popupActions.appendChild(btn);
      });
      popupOverlay.classList.add('active');
    }

    function closePopup() { popupOverlay.classList.remove('active'); }

    function showDepositPopup() {
      showPopup('info', '💳 Deposit Funds', 'Add funds to your balance to continue playing.', [
        {
          text: 'Deposit 100 USDT',
          style: 'deposit',
          callback: () => {
            balance += 100;
            updateDisplay();
            showPopup('success', '✅ Deposit Successful', '100 USDT has been added to your balance!', [
              { text: 'Continue', style: 'primary' }
            ]);
          }
        },
        { text: 'Cancel', style: 'secondary' }
      ]);
    }

    function showWithdrawPopup() {
      if (balance <= 0) {
        showPopup('warning', '⚠️ No Funds', 'Your balance is empty. Please deposit funds first.', [
          { text: 'Deposit', style: 'deposit', callback: showDepositPopup },
          { text: 'Close', style: 'secondary' }
        ]);
        return;
      }
      showPopup('info', '💸 Withdraw Funds', `Current balance: ${balance.toFixed(2)} USDT. Withdrawal feature coming soon!`, [
        { text: 'OK', style: 'primary' }
      ]);
    }

    // ===== ROLL DICE =====
    function rollDice(isAuto = false) {
      if (isRolling) return;

      if (betAmount <= 0) {
        if (!isAuto) {
          showPopup('warning', '⚠️ Invalid Bet', 'Please enter a valid bet amount greater than 0.', [
            { text: 'OK', style: 'primary' }
          ]);
        }
        return;
      }

      if (betAmount > balance) {
        if (isAuto) {
          betAmount = balance;
          betAmountEl.value = betAmount.toFixed(2);
          updateDisplay();
          if (balance <= 0) {
            stopAutoRoll();
            showPopup('error', ' Balance Empty', 'Auto roll stopped. Please deposit funds.', [
              { text: 'Deposit', style: 'deposit', callback: showDepositPopup },
              { text: 'Close', style: 'secondary' }
            ]);
          }
          return;
        } else {
          betAmount = balance;
          betAmountEl.value = betAmount.toFixed(2);
          updateDisplay();
          showPopup('warning', '️ Insufficient Balance', `Your bet was adjusted to your full balance of ${balance.toFixed(2)} USDT.`, [
            { text: 'Deposit Funds', style: 'deposit', callback: showDepositPopup },
            { text: 'Continue', style: 'secondary' }
          ]);
        }
      }

      if (balance <= 0) {
        if (isAuto) {
          stopAutoRoll();
          showPopup('error', '❌ Game Over', 'Your balance is empty! Auto roll stopped.', [
            {
              text: 'Deposit 100 USDT',
              style: 'deposit',
              callback: () => {
                balance += 100;
                updateDisplay();
                showPopup('success', '✅ Balance Restored', '100 USDT has been added.', [
                  { text: 'Play', style: 'primary' }
                ]);
              }
            },
            { text: 'Cancel', style: 'secondary' }
          ]);
        } else {
          showPopup('error', '❌ Game Over', 'Your balance is empty! Please deposit funds to continue playing.', [
            {
              text: 'Deposit 100 USDT',
              style: 'deposit',
              callback: () => {
                balance += 100;
                updateDisplay();
                showPopup('success', '✅ Balance Restored', '100 USDT has been added.', [
                  { text: 'Play', style: 'primary' }
                ]);
              }
            },
            { text: 'Cancel', style: 'secondary' }
          ]);
        }
        return;
      }

      isRolling = true;

      const values = calculateGameValues();
      const roll = Math.random() * 100;

      rangeThumb.classList.remove('returning');
      rangeThumb.classList.add('animating');
      rangeThumb.style.left = '0%';

      // Fast animation for auto mode
      const animSpeed = isAuto ? 10 : 100;
      const resultDelay = isAuto ? 20 : 600;
      const returnDelay = isAuto ? 10 : 300;

      setTimeout(() => {
        rangeThumb.style.left = roll + '%';

        setTimeout(() => {
          diceResultNumber.textContent = roll.toFixed(2);

          let won;
          if (gameMode === 'under') {
            won = roll < values.payoutPoint;
          } else {
            won = roll > values.payoutPoint;
          }

          diceResultNumber.classList.remove('win-flash', 'lose-flash');
          void diceResultNumber.offsetWidth;
          diceResultNumber.classList.add(won ? 'win-flash' : 'lose-flash');

          sessionStats.rounds++;
          if (won) {
            sessionStats.wins++;
            balance += values.profitOnWin;
          } else {
            sessionStats.losses++;
            balance -= betAmount;
          }

          // Save to history
          const record = {
            bet: betAmount,
            roll: roll,
            won: won,
            profit: won ? values.profitOnWin : -betAmount
          };
          gameHistory.unshift(record);
          if (gameHistory.length > 50) gameHistory.pop();
          renderHistory();

          // Auto roll strategy
          if (autoRollEnabled) {
            if (won) {
              if (autoSettings.onWin === 'reset') {
                betAmount = autoSettings.baseBet;
              } else if (autoSettings.onWin === 'stop') {
                stopAutoRoll();
              }
            } else {
              if (autoSettings.onLoss === 'double') {
                betAmount = betAmount * 2;
              } else if (autoSettings.onLoss === 'custom') {
                betAmount = betAmount * autoSettings.lossMultiplier;
              }
            }

            betAmountEl.value = betAmount.toFixed(2);

            if (betAmount > balance) {
              stopAutoRoll();
              showPopup('warning', '⚠️ Bet Exceeds Balance', `Auto roll stopped. Bet (${betAmount.toFixed(2)}) exceeds balance (${balance.toFixed(2)}).`, [
                { text: 'Deposit', style: 'deposit', callback: showDepositPopup },
                { text: 'Close', style: 'secondary' }
              ]);
            }
          }

          updateDisplay();

          setTimeout(() => {
            rangeThumb.classList.remove('animating');
            rangeThumb.classList.add('returning');
            rangeThumb.style.left = values.payoutPoint + '%';

            setTimeout(() => {
              rangeThumb.classList.remove('returning');
              isRolling = false;
            }, isAuto ? 10 : 500);
          }, returnDelay);

        }, resultDelay);
      }, animSpeed);
    }

    settingsOverlay.addEventListener('click', (e) => {
      if (e.target === settingsOverlay) {
        closeAutoSettings();
      }
    });

    // Initialize
    buildSegments();
    loadGameData();
    updateDisplay();
  </script>
</body>
</html>
